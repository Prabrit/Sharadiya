  <!-- Leaflet (free, OpenStreetMap-based maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --accent-gold: #D4AF37;
      --primary-crimson: #A91D22;

      --surface-container: rgba(32, 14, 16, 0.4);
      --surface-container-high: rgba(48, 18, 21, 0.5);
      --state-hover: rgba(255, 255, 255, 0.08);
      --state-press: rgba(255, 255, 255, 0.14);
      --elevation-2: 0 1px 3px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.28);
      --elevation-4: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
      overscroll-behavior: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
    }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
    }

    .ui-container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-shrink: 0; }

    .note-pill {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
      padding: 7px 16px 7px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      color: #fff; text-decoration: none; cursor: pointer; overflow: hidden;
      transition: background .2s ease, transform .2s ease;
    }
    .note-pill:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
    .note-icon { color: var(--accent-gold); filter: drop-shadow(0 0 4px rgba(212,175,55,.6)); flex-shrink: 0; }

    .clock-container { display: flex; flex-direction: column; align-items: flex-end; }
    .clock-row { display: flex; align-items: center; gap: 8px; }
    .clock { font-weight: 500; font-size: 0.9rem; letter-spacing: 1px; }

    .online-badge {
      display: flex; align-items: center; gap: 5px;
      background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
      padding: 4px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; color: #fff;
    }
    .online-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: #3ddc73; box-shadow: 0 0 6px rgba(61,220,115,.8);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .countdown-bar {
      font-family: 'Tiro Bangla', serif;
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      color: var(--accent-gold);
      margin-top: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .center-title {
      flex-shrink: 0;
      text-align: center; width: 100%; max-width: 500px;
      margin: clamp(8px, 4vh, 32px) auto 0;
    }
    .bengali-title { font-family: 'Tiro Bangla', serif; font-size: clamp(2.4rem, 11vw, 4.8rem); text-shadow: 2px 4px 12px rgba(0,0,0,0.4); margin-bottom: -6px; line-height: 1.05;}
    .english-subtitle { font-size: clamp(0.85rem, 2.6vw, 1.1rem); letter-spacing: 4px; opacity: 0.9; margin-bottom: clamp(14px, 3vh, 25px); }

    .view-switcher {
      display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: nowrap;
      background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px);
      padding: 5px; border-radius: 30px; border: 1px solid var(--glass-border);
      max-width: 100%; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
    }
    .view-switcher::-webkit-scrollbar { display: none; }
    .switch-btn {
      position: relative; overflow: hidden; flex-shrink: 0;
      background: none; border: none; color: var(--text-muted);
      padding: 8px 12px; border-radius: 20px; font-weight: 600;
      font-size: clamp(0.72rem, 2.6vw, 0.85rem); white-space: nowrap; cursor: pointer; transition: all 0.3s;
    }
    .switch-btn.active { background: rgba(255, 255, 255, 0.15); color: #FFF; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .bottom-area {
      margin-top: auto; display: flex; flex-direction: column; gap: 12px;
      max-width: 650px; margin-left: auto; margin-right: auto; width: 100%;
      min-height: 0;
    }

    .views-wrapper { width: 100%; min-height: 0; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .glass-player {
      background: linear-gradient(160deg, var(--surface-container-high), var(--surface-container));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 28px;
      padding: 12px 14px 12px 12px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--elevation-4);
    }
    .album-art {
      width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0;
      background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=200&auto=format&fit=crop') center/cover;
      box-shadow: var(--elevation-2); transition: background-image 0.5s ease;
    }
    .player-controls { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .track-info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; }
    .track-title { font-weight: 600; font-size: .92rem; letter-spacing: .1px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-time { color: var(--text-muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }

    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; position: relative; cursor: pointer;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--accent-gold);
      border-radius: 2px; position: relative; transition: width 0.5s linear;
    }
    .progress-fill::after {
      content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent-gold);
      box-shadow: 0 0 6px rgba(212,175,55,.7);
    }

    .btn-row { display: flex; align-items: center; gap: 8px; }

    .ctrl-btn {
      position: relative; overflow: hidden;
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: white; cursor: pointer;
      opacity: 0.85; font-size: 1.1rem; transition: background .2s ease, opacity .2s ease;
    }
    .ctrl-btn:hover { background: var(--state-hover); opacity: 1; }

    .play-btn {
      position: relative; overflow: hidden;
      width: 50px; height: 50px; background: var(--accent-gold); color: #2A1400; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding-left: 3px;
      box-shadow: var(--elevation-2); transition: transform .15s ease, box-shadow .2s ease;
    }

    .menu-btn {
      position: relative; overflow: hidden;
      background: rgba(255,255,255,0.05); border: none;
      color: white; width: 44px; height: 62px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s; flex-shrink: 0; font-size: 1.2rem;
    }

    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      background: rgba(255,255,255,.5); animation: ripple-anim .55s ease-out; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(2.8); opacity: 0; } }

    .pandal-list-panel {
      background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 18px; max-height: min(280px, 32vh); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .pandal-list-panel::-webkit-scrollbar { width: 6px; }
    .pandal-list-panel::-webkit-scrollbar-track { background: transparent; }
    .pandal-list-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    /* Search box (Pandals + Metro tabs) */
    .search-wrap { position: sticky; top: 0; z-index: 2; margin-bottom: 10px; }
    .search-box { position: relative; }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px; color: var(--text-muted); pointer-events: none;
    }
    .search-input {
      width: 100%; padding: 9px 34px; border-radius: 12px;
      background: rgba(20, 8, 10, 0.55);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border); color: var(--text-main);
      font-family: inherit; font-size: 0.85rem; outline: none;
      -webkit-appearance: none; appearance: none;
      transition: border-color .2s ease, background .2s ease;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent-gold); background: rgba(20, 8, 10, 0.75); }
    .search-input::-webkit-search-cancel-button,
    .search-input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    .search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-muted); font-size: 1.15rem; line-height: 1;
      cursor: pointer; display: none; align-items: center; justify-content: center;
    }
    .search-clear.show { display: flex; }
    .search-clear:hover { background: var(--state-hover); color: #fff; }
    .search-empty { text-align: center; padding: 18px 8px; font-size: 0.82rem; color: var(--text-muted); }
    @media (max-width: 768px) { .search-input { font-size: 16px; } } /* stops iOS zooming in on focus */

    .pandal-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: rgba(0,0,0,0.2);
      border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
    }
    .pandal-card h4 { font-size: 0.95rem; }
    .pandal-card p { font-size: 0.8rem; color: var(--text-muted); }
    .route-btn { background: var(--primary-crimson); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; flex-shrink: 0;}

    .pandal-card.mahalaya-card { cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .pandal-card.mahalaya-card:hover { background: rgba(0,0,0,0.32); }
    .pandal-card.mahalaya-card.playing { background: rgba(212, 175, 55, 0.18); border-color: var(--accent-gold); }
    .mahalaya-play-btn {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--accent-gold); color: #2A1400; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding-left: 2px;
    }
    .pandal-card.mahalaya-card.playing .mahalaya-play-btn { padding-left: 0; }

    .footer {
      flex-shrink: 0;
      text-align: center; margin-top: 10px;
      font-size: 0.78rem; font-weight: 500; color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .drawer {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 600px; height: 42vh; max-height: 360px;
      background: rgba(18, 8, 10, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-bottom: none; z-index: 10;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 14px 18px; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
    }
    .drawer.open { bottom: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08);}
    .drawer-header h3 { font-size: 0.95rem; font-weight: 600; }
    .close-btn { background: none; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; opacity: 0.8; }
    .close-btn:hover { opacity: 1; }

    .playlist-items { 
      overflow-y: auto; 
      flex: 1;
      display: flex; flex-direction: column; gap: 6px; 
      padding-bottom: 10px;
      padding-right: 4px;
    }
    
    .playlist-items::-webkit-scrollbar { width: 4px; }
    .playlist-items::-webkit-scrollbar-track { background: transparent; }
    .playlist-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .playlist-item {
      position: relative; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      background: rgba(255,255,255,0.03); border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .playlist-item:hover { background: rgba(255,255,255,0.1); border-color: var(--glass-border); }
    .playlist-item.active { background: rgba(212, 175, 55, 0.25); border-color: var(--accent-gold); }
    .playlist-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
    .playlist-info h5 { font-size: 0.82rem; font-weight: 600; line-height: 1.2; }
    .playlist-info p { font-size: 0.7rem; color: var(--text-muted); }

    
    @media (max-height: 700px) {
      .center-title { margin-top: clamp(6px, 2vh, 16px); }
      .english-subtitle { margin-bottom: clamp(8px, 1.6vh, 14px); }
      .countdown-bar { margin-top: 6px; }
      .bottom-area { gap: 8px; }
      .pandal-list-panel { max-height: min(220px, 30vh); padding: 14px; }
    }
    @media (max-height: 520px) {
      .center-title { margin-top: 4px; }
      .bengali-title { font-size: clamp(1.8rem, 9vw, 2.6rem); }
      .english-subtitle { font-size: 0.75rem; margin-bottom: 6px; }
      .countdown-bar { display: none; }
      .glass-player { padding: 8px 10px; gap: 10px; }
      .album-art { width: 46px; height: 46px; }
    }

    
    @media (max-width: 300px), (max-height: 340px) {
      .ui-container {
        padding-top: max(14px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        padding-left: max(20px, 14%);
        padding-right: max(20px, 14%);
      }
      .note-pill span { display: none; }
      .note-pill { padding: 6px; }
      .clock { font-size: 0.65rem; }
      .online-badge { padding: 3px 6px; gap: 3px; font-size: 0.56rem; }
      .online-badge .online-label { display: none; }
      .bengali-title { font-size: clamp(1.2rem, 15vw, 1.7rem); }
      .english-subtitle { font-size: 0.56rem; letter-spacing: 1.5px; margin-bottom: 6px; }
      .view-switcher { padding: 3px; gap: 2px; }
      .switch-btn { padding: 5px 7px; font-size: 0.56rem; }
      .glass-player { padding: 6px 8px; gap: 6px; border-radius: 16px; }
      .album-art { width: 30px; height: 30px; border-radius: 9px; }
      .track-title { max-width: 68px; font-size: 0.62rem; }
      .track-time { display: none; }
      .ctrl-btn { width: 26px; height: 26px; font-size: 0.78rem; }
      .play-btn { width: 32px; height: 32px; }
      .menu-btn { width: 26px; height: 40px; font-size: 0.78rem; }
      .footer { font-size: 0.52rem; margin-top: 8px; }
      .pandal-list-panel { padding: 8px; max-height: 34vh; }
      .search-input { padding: 5px 22px; font-size: 0.62rem; border-radius: 8px; }
      .search-icon { left: 6px; width: 10px; height: 10px; }
      .search-clear { width: 18px; height: 18px; font-size: 0.85rem; right: 2px; }
      .search-wrap { margin-bottom: 6px; }
      .pandal-card { padding: 6px; gap: 6px; }
      .pandal-card h4 { font-size: 0.66rem; line-height: 1.15; }
      .pandal-card p { font-size: 0.56rem; }
      .route-btn { padding: 4px 6px; font-size: 0.56rem; }
      .mahalaya-play-btn { width: 28px; height: 28px; font-size: 0.75rem; }
    }

    /* ===== Full-screen map background (Pandals + Metro tabs) ===== */
    #bgMap { position: fixed; inset: 0; z-index: 0; display: none; background: #e9e6df; }
    body.map-mode #bgMap { display: block; }
    body.map-mode { background-color: #e9e6df; }
    #bgMap .leaflet-top { margin-top: 56px; }
    #bgMap .leaflet-control-attribution { font-size: 10px; }

    /* let the map receive taps/drags; only the real controls catch pointer events */
    body.map-mode .overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
    }
    body.map-mode .ui-container { pointer-events: none; }
    body.map-mode .note-pill,
    body.map-mode .online-badge,
    body.map-mode .view-switcher,
    body.map-mode .pandal-list-panel { pointer-events: auto; }

    /* header + list keep the app's dark glass look, floating over the bright map */
    body.map-mode .countdown-bar,
    body.map-mode .english-subtitle { display: none; }
    body.map-mode .center-title { margin-top: 4px; }
    body.map-mode .bengali-title {
      font-size: clamp(1.6rem, 6vw, 2.4rem); margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 2px rgba(0,0,0,0.6);
    }
    body.map-mode .note-pill,
    body.map-mode .online-badge,
    body.map-mode .view-switcher { background: rgba(32, 14, 16, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    body.map-mode .clock { text-shadow: 0 1px 6px rgba(0,0,0,0.8); }
    body.map-mode .pandal-list-panel { background: rgba(32, 14, 16, 0.82); max-height: min(300px, 38vh); }
    body.map-mode .footer { text-shadow: 0 1px 6px rgba(0,0,0,0.9); }

    .pandal-card.selectable { cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .pandal-card.selectable:hover { background: rgba(0,0,0,0.32); }
    .pandal-card.selected { background: rgba(212, 175, 55, 0.18); border-color: var(--accent-gold); }

    /* map pins */
    .pin-wrap { background: none; border: none; }
    .pin-wrap svg, .pin-wrap img {
      display: block; overflow: visible;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
      transform-origin: 50% 100%; transition: transform .15s ease, filter .15s ease;
    }
    .pin-wrap.selected svg, .pin-wrap.selected img {
      transform: scale(1.3);
      filter: drop-shadow(0 0 6px #D4AF37) drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    }

    .leaflet-popup-content { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.8rem; line-height: 1.45; margin: 10px 14px; }
    .leaflet-popup-content a { color: var(--primary-crimson); font-weight: 600; }
    /* ===== Trip planner ===== */
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff;
      border-radius: 16px; padding: 6px 11px; font-family: inherit; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: background .2s ease;
    }
    .chip:hover { background: rgba(255,255,255,0.18); }
    .chip.on { background: var(--primary-crimson); border-color: var(--primary-crimson); }
    .chip:disabled { opacity: 0.45; cursor: default; }

    .trip-num-wrap { background: none; border: none; }

      box-shadow: 0 2px 6px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;

      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

  <script>
    
    
    
    const playlists = {
      pujo: [
      { title: "Aham Rudre", src: "pujo_songs/aham rudre.mp3", art: "logo.png" },
      { title: "Chaarpase Alo Hok", src: "pujo_songs/Charpase Alo Hok.mp3", art: "logo.png" },
      { title: "Madhukaitava Vidhwangsi", src: "pujo_songs/Madhukaitava Vidhwangsi.mp3", art: "logo.png" },
      { title: "Jaago Uma", src: "pujo_songs/Jaago Uma.mp3", art: "logo.png" },
      { title: "DHAK BAJA KASHOR BAJA", src: "pujo_songs/DHAK BAJA KASHOR BAJA.mp3", art: "logo.png" },
      { title: "Aaj Baaje", src: "pujo_songs/Aaj Baaje.mp3", art: "logo.png" },
      { title: "Dugga Elo", src: "pujo_songs/Dugga Elo.mp3", art: "logo.png" },
      { title: "Agomonir Gaan", src: "pujo_songs/Agomonir Gaan.mp3", art: "logo.png" },
      { title: "Esho Naba Rupe", src: "pujo_songs/Esho Naba Rupe .mp3", art: "logo.png" },
      { title: "Dhaker Taley", src: "pujo_songs/Dhaker Taley.mp3", art: "logo.png" },
      { title: "Durge Durge Durgatinashini", src: "pujo_songs/Durge Durge Durgatinashini .mp3", art: "logo.png" },
      { title: "Gouri Elo", src: "pujo_songs/Gouri Elo.mp3", art: "logo.png" },
      { title: "Jago Jogmaya Jago Mrinmoyee", src: "pujo_songs/Jago Jogmaya Jago Mrinmoyee.mp3", art: "logo.png" },
      { title: "Pujar Gaan", src: "pujo_songs/Pujar Gaan.mp3", art: "logo.png" },
      { title: "Nakku Nakur Na Jao Thakur", src: "pujo_songs/Nakku Nakur Na Jao Thakur.mp3", art: "logo.png" },
      { title: "Doob De Re Mon", src: "pujo_songs/Doob De Re Mon.mp3", art: "logo.png" },
      { title: "Ailo Uma Barite", src: "pujo_songs/Ailo Uma Barite.mp3", art: "logo.png" },
      { title: "Dugga Ma", src: "pujo_songs/Dugga Ma.mp3", art: "logo.png" },
      { title: "Ebar Jeno Onno Rokom Pujo", src: "pujo_songs/Ebar Jeno Onno Rokom Pujo.mp3", art: "logo.png" },
      { title: "Elo Je Maa", src: "pujo_songs/Elo Je Maa.mp3", art: "logo.png" },
      { title: "Maa Go Tui", src: "pujo_songs/Maa Go Tui.mp3", art: "logo.png" }

      ],
      mahalaya: [
        { title: "Mahalaya (Mahishasura Mardini)", src: "mahalaya/Mahalaya (Mahishasura Mardini).mp3", art: "mahalaya.jpg" }
      ]
    };

    const audio = document.getElementById('mainAudio');
    let activeList = 'pujo';           
    let currentIndex = 0;
    let isPlaying = false;
    let wakeLock = null;              

    const bgImages = ['Sakti.png','chokhudan.jpg', 'alo.jpg', 'dristi.png', 'poribar.jpg' , 'prem.png' , 'pujoalo.jpg' , 'sobarpujo.jpg' ]; 
    let bgIndex = 0;

    function updateBackground() {
      if (document.body.classList.contains('map-mode')) {   // Pandals / Metro: the map is the background
        document.body.style.backgroundImage = 'none';
        return;
      }
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const isLaptop = window.innerWidth > 768;

      if (isLandscape || isLaptop) {
        document.body.style.backgroundImage = `url('pujo.png ')`;
      } else {
        document.body.style.backgroundImage = `url('${bgImages[bgIndex]}')`;
      }
    }

    function rotateBackground() {
      bgIndex = (bgIndex + 1) % bgImages.length;
      updateBackground();
    }
    
    setInterval(rotateBackground, 600000);
    window.addEventListener('resize', updateBackground);
    updateBackground();

   
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {
        wakeLock = null;
      }
    }

    function releaseWakeLock() {
      try {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
      } catch (e) {}
    }

    
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isPlaying) {
        await requestWakeLock();
      }
    });

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined) audio.currentTime = details.seekTime;
        });
      } catch (e) {}
    }

    function updateMediaSessionMetadata(track) {
      if (!('mediaSession' in navigator) || !track) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || 'Sharadiya Sangeet',
        artist: 'Pujo Playlist • Sharadiya',
        album: 'শারদীয়া',
        artwork: [{ src: track.art, sizes: '512x512', type: 'image/jpeg' }]
      });
    }

    function loadTrack(listKey, index, autoplay) {
      const list = playlists[listKey];
      activeList = listKey;
      currentIndex = (index + list.length) % list.length;
      const track = list[currentIndex];
      audio.src = track.src;
      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('albumArt').style.backgroundImage = `url('${track.art}')`;
      updateMediaSessionMetadata(track);
      highlightActiveTrackInDrawer();
      highlightActiveMahalayaItem();
      if (autoplay) audio.play().catch(() => {});
    }

    function togglePlay(e) {
      if (e) addRipple(e, true);
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function nextTrack(e) { if (e) addRipple(e); loadTrack(activeList, currentIndex + 1, true); }
    function prevTrack(e) { if (e) addRipple(e); loadTrack(activeList, currentIndex - 1, true); }

    
    audio.addEventListener('play', () => {
      isPlaying = true;
      const playBtn = document.getElementById('mainPlayBtn');
      playBtn.innerText = '❚❚';
      playBtn.style.paddingLeft = '0';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      requestWakeLock();
      highlightActiveMahalayaItem();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      const playBtn = document.getElementById('mainPlayBtn');
      playBtn.innerText = '▶';
      playBtn.style.paddingLeft = '3px';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      releaseWakeLock();
      highlightActiveMahalayaItem();
    });

    audio.addEventListener('ended', () => nextTrack());

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('trackTime').innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    document.getElementById('progressBar').addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    function renderPlaylistDrawer() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = playlists.pujo.map((t, index) => `
          <div class="playlist-item" id="item-${index}" onclick="selectTrack(${index}, event)">
            <img class="playlist-thumb" src="${t.art}">
            <div class="playlist-info">
              <h5 id="title-${index}">${t.title}</h5>
              <p>Click to Play</p>
            </div>
          </div>`).join('');
    }

    function highlightActiveTrackInDrawer() {
      document.querySelectorAll('.playlist-item').forEach((item, index) => {
        item.classList.toggle('active', activeList === 'pujo' && index === currentIndex);
      });
    }

    function selectTrack(index, e) {
      if (e) addRipple(e);
      loadTrack('pujo', index, true);
      setTimeout(toggleDrawer, 150);
    }

    
    function renderMahalayaList() {
      const container = document.getElementById('mahalayaContainer');
      container.innerHTML = playlists.mahalaya.map((t, index) => `
        <div class="pandal-card mahalaya-card" id="mahalaya-item-${index}" onclick="selectMahalayaTrack(${index}, event)">
          <div><h4>${t.title}</h4><p>Tap to play</p></div>
          <button class="mahalaya-play-btn" id="mahalaya-btn-${index}" onclick="selectMahalayaTrack(${index}, event)">▶</button>
        </div>`).join('');
      highlightActiveMahalayaItem();
    }

    function highlightActiveMahalayaItem() {
      playlists.mahalaya.forEach((t, index) => {
        const card = document.getElementById(`mahalaya-item-${index}`);
        const btn = document.getElementById(`mahalaya-btn-${index}`);
        if (!card || !btn) return;
        const isCurrent = activeList === 'mahalaya' && index === currentIndex;
        card.classList.toggle('playing', isCurrent && isPlaying);
        btn.innerText = (isCurrent && isPlaying) ? '❚❚' : '▶';
      });
    }

    function selectMahalayaTrack(index, e) {
      if (e) e.stopPropagation();
      if (activeList === 'mahalaya' && index === currentIndex) {
        togglePlay();
      } else {
        loadTrack('mahalaya', index, true);
      }
    }

    
    setupMediaSession();
    renderPlaylistDrawer();
    renderMahalayaList();
    loadTrack('pujo', 0, false);

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ":" + (sec < 10 ? "0" : "") + sec;
    }

    // West Bengal calendar dates for 2026 — update every year
    const PUJO_DATES_2026 = {
      mahalaya: [2026, 10, 10],
      shashthi: [2026, 10, 17],
      saptami:  [2026, 10, 18],
      ashtami:  [2026, 10, 19],
      nabami:   [2026, 10, 20],
      dashami:  [2026, 10, 21]
    };

    function istDateKey() {
      const ist = new Date(Date.now() + 5.5 * 60 * 60 * 1000);
      return ist.getUTCFullYear() * 10000 + (ist.getUTCMonth() + 1) * 100 + ist.getUTCDate();
    }
    function dateKey([y, m, d]) { return y * 10000 + m * 100 + d; }
    function daysBetween(targetKey, todayKey) {
      const p = k => [Math.floor(k / 10000), Math.floor((k % 10000) / 100), k % 100];
      const [ty, tm, td] = p(todayKey), [gy, gm, gd] = p(targetKey);
      return Math.round((Date.UTC(gy, gm - 1, gd) - Date.UTC(ty, tm - 1, td)) / 86400000);
    }

    function getPujoStatusText() {
      const today = istDateKey();
      const D = PUJO_DATES_2026;
      const mahalaya = dateKey(D.mahalaya), shashthi = dateKey(D.shashthi),
            saptami = dateKey(D.saptami), ashtami = dateKey(D.ashtami),
            nabami = dateKey(D.nabami), dashami = dateKey(D.dashami);

      if (today === mahalaya) return '🙏 শুভ মহালয়া';
      if (today === shashthi) return 'আজ ষষ্ঠী';
      if (today === saptami)  return 'আজ মহাসপ্তমী';
      if (today === ashtami)  return 'আজ মহাষ্টমী';
      if (today === nabami)   return 'আজ মহানবমী';
      if (today === dashami)  return 'শুভ বিজয়া দশমী 🙏';
      if (today > dashami)    return 'শুভ শারদীয়া!';
      if (today < mahalaya)   return `মহালয়া আসতে আর ${daysBetween(mahalaya, today)} দিন বাকি`;
      return `দুর্গাপুজোর আর ${daysBetween(shashthi, today)} দিন বাকি`;
    }

    function updateTimeAndCountdown() {
      const now = new Date();
      let hours = now.getHours(), minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('liveClock').innerText = `${hours}:${minutes} ${ampm}`;

      document.getElementById('pujoCountdown').innerText = getPujoStatusText();
    }
    setInterval(updateTimeAndCountdown, 1000); 
    updateTimeAndCountdown();

    function addRipple(e, dark) {
      const btn = e.currentTarget;
      const existing = btn.querySelector('.ripple');
      if (existing) existing.remove();
      const rect = btn.getBoundingClientRect();
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;
      const clientX = e.clientX || (rect.left + rect.width / 2);
      const clientY = e.clientY || (rect.top + rect.height / 2);
      const circle = document.createElement('span');
      circle.className = 'ripple' + (dark ? ' ripple-dark' : '');
      circle.style.width = circle.style.height = diameter + 'px';
      circle.style.left = (clientX - rect.left - radius) + 'px';
      circle.style.top = (clientY - rect.top - radius) + 'px';
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 600);
    }

    function rippleNav(e) {
      e.preventDefault();
      addRipple(e);
      const href = e.currentTarget.getAttribute('href');
      setTimeout(() => { window.open(href, '_blank'); }, 200);
    }

    function switchMode(mode, btn, e) {
      if (e) addRipple(e);
      document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.body.classList.toggle('map-mode', mode === 'parikrama' || mode === 'metro' || mode === 'trip');
      updateBackground();

      if(mode === 'player') {
        document.getElementById('playerView').classList.add('active');
      } else if (mode === 'parikrama') {
        document.getElementById('parikramaView').classList.add('active');
        ensureMap('parikrama');
        getUserLocation();
      } else if (mode === 'metro') {
        document.getElementById('metroView').classList.add('active');
        ensureMap('metro');
        renderMetroList();
      } else if (mode === 'trip') {
        document.getElementById('tripView').classList.add('active');
        ensureMap('trip');
        renderTrip();
      } else if (mode === 'mahalaya') {
        document.getElementById('mahalayaView').classList.add('active');
        highlightActiveMahalayaItem();
      }

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * (Math.PI/180);
      const dLon = (lon2 - lon1) * (Math.PI/180); 
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; 
    }

    // Straight-line (Haversine) above is kept only as a fallback.
    // Road distance: OSRM public routing (OpenStreetMap data, no API key).
    // Maps: Leaflet + OpenStreetMap tiles. Metro walk: OSM foot routing + Nominatim geocoding.
    pandals.forEach((p, i) => { p.id = i; });
    pandals.forEach(p => { if (p.approx) p.location += ' · approx. pin'; });   // no exact coordinates on source

    const KOLKATA_CENTER = [22.5726, 88.3639];
    let userPos = null;            // { lat, lng }
    let roadFetchedAt = 0;         // timestamp of last successful road-distance fetch
    let roadRequestToken = 0;
    const walkInfo = {};           // pandal id -> { km, mins } (metro station -> pandal, on foot)

    function formatDist(km) {
      return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
    }

    async function fetchJson(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms || 9000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Road distance from the user to every pandal. The public OSRM server limits a table request
    // to ~100 coordinates, so the list is split into chunks and fetched in parallel.
    async function fetchRoadDistancesKm(lat, lng) {
      const CHUNK = 90;
      const out = new Array(pandals.length).fill(null);
      const jobs = [];
      for (let start = 0; start < pandals.length; start += CHUNK) {
        const slice = pandals.slice(start, start + CHUNK);
        const coords = [[lng, lat]].concat(slice.map(p => [p.lng, p.lat]))
          .map(c => c.join(',')).join(';');
        jobs.push(fetchJson(
          'https://router.project-osrm.org/table/v1/driving/' + coords + '?sources=0&annotations=distance'
        ).then(data => {
          if (data.code !== 'Ok' || !data.distances || !data.distances[0]) throw new Error('OSRM: ' + data.code);
          data.distances[0].slice(1).forEach((m, k) => { out[start + k] = (typeof m === 'number' ? m / 1000 : null); });
        }));
      }
      await Promise.all(jobs);
      return out;
    }

    function applyDistances(roadKm) {
      pandals.forEach((p, i) => {
        p.straightKm = getDistanceFromLatLonInKm(userPos.lat, userPos.lng, p.lat, p.lng);
        const r = roadKm ? roadKm[i] : null;
        p.isRoad = typeof r === 'number';
        p.distance = p.isRoad ? r : p.straightKm;
      });
    }

    function sortedByDistance() {
      return pandals.slice().sort((a, b) => a.distance - b.distance);
    }

    function getUserLocation() {
      const statusMsg = document.getElementById('statusMsg');

      // Reuse a recent road-distance result instead of re-asking every tab switch
      if (userPos && Date.now() - roadFetchedAt < 5 * 60 * 1000) {
        renderPandals(sortedByDistance());
        return;
      }

      if (!('geolocation' in navigator)) {
        statusMsg.innerText = "Geolocation not supported. Showing default list.";
        renderPandals(pandals);
        return;
      }

      statusMsg.innerText = 'Finding your location…';
      navigator.geolocation.getCurrentPosition(async (position) => {
        userPos = { lat: position.coords.latitude, lng: position.coords.longitude };

        // 1) show straight-line results immediately
        applyDistances(null);
        renderPandals(sortedByDistance());
        updateUserMarker();
        if (MAPS.parikrama.map && MAPS.parikrama.selected === null) fitAll('parikrama');

        // 2) upgrade to real road distances
        statusMsg.innerText = 'Calculating road distances…';
        const token = ++roadRequestToken;
        try {
          const roadKm = await fetchRoadDistancesKm(userPos.lat, userPos.lng);
          if (token !== roadRequestToken) return;
          applyDistances(roadKm);
          roadFetchedAt = Date.now();
          statusMsg.innerText = 'Showing pandals nearest to you by road';
        } catch (err) {
          if (token !== roadRequestToken) return;
          console.warn('Road routing unavailable, using straight-line distance:', err);
          statusMsg.innerText = 'Road routing unavailable — showing straight-line distances';
        }
        renderPandals(sortedByDistance());
      }, () => {
        statusMsg.innerText = "Location access denied. Showing default list.";
        renderPandals(pandals);
      }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    }

    // ---- Pin icons ----
    // To use your own artwork instead, put a path here, e.g. { pujo: 'pujo-pin.png', metro: 'metro-pin.png' }
    const PIN_IMAGES = { pujo: null, metro: null };
    const PIN_SIZE = [32, 42];
    const PIN_BODY = 'M16 41C16 41 3 26 3 15a13 13 0 0 1 26 0C29 26 16 41 16 41Z';

    // Pujo pin: crimson pin with a gold-cream disc and a trishul
    const PUJO_PIN_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="32" height="42">' +
      '<path d="' + PIN_BODY + '" fill="#A91D22" stroke="#fff" stroke-width="2"/>' +
      '<circle cx="16" cy="15" r="9.5" fill="#FFF4D6"/>' +
      '<g fill="#A91D22" stroke="#A91D22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M16 22V9" fill="none"/>' +
        '<path d="M11.8 9.5V12.5Q11.8 15.2 16 15.2Q20.2 15.2 20.2 12.5V9.5" fill="none"/>' +
        '<path d="M16 6.2L17.5 9.2H14.5Z"/><path d="M11.8 7L13.3 10H10.3Z"/><path d="M20.2 7L21.7 10H18.7Z"/>' +
      '</g></svg>';

    // Metro pin: black pin with a white disc and a train front
    const METRO_PIN_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="32" height="42">' +
      '<path d="' + PIN_BODY + '" fill="#111" stroke="#fff" stroke-width="2"/>' +
      '<circle cx="16" cy="15" r="9.5" fill="#fff"/>' +
      '<rect x="11" y="7.5" width="10" height="12" rx="2.4" fill="#111"/>' +
      '<rect x="12.6" y="9.2" width="6.8" height="4.2" rx="1" fill="#fff"/>' +
      '<circle cx="13.7" cy="16.4" r="1" fill="#fff"/><circle cx="18.3" cy="16.4" r="1" fill="#fff"/>' +
      '<path d="M13 21.5L11.6 23.8M19 21.5L20.4 23.8M12.6 22.6H19.4" stroke="#111" stroke-width="1.3" stroke-linecap="round" fill="none"/>' +
      '</svg>';

    function pinIcon(kind) {
      const html = PIN_IMAGES[kind]
        ? '<img src="' + PIN_IMAGES[kind] + '" alt="" style="width:' + PIN_SIZE[0] + 'px;height:' + PIN_SIZE[1] + 'px;object-fit:contain">'
        : (kind === 'metro' ? METRO_PIN_SVG : PUJO_PIN_SVG);
      return L.divIcon({
        html: html, className: 'pin-wrap', iconSize: PIN_SIZE,
        iconAnchor: [16, 41], popupAnchor: [0, -38], tooltipAnchor: [0, -38]
      });
    }

    function setPinSelected(mk, on) {
      if (!mk) return;
      if (mk.setStyle) {                       // circle dot (pandals on the Metro tab)
        mk.setStyle(on ? { fillColor: '#D4AF37', radius: 9 } : { fillColor: '#A91D22', radius: 5 });
        if (on) mk.bringToFront();
        return;
      }
      const el = mk.getElement && mk.getElement();
      if (el) el.classList.toggle('selected', on);
      mk.setZIndexOffset(on ? 1000 : 0);
    }

    // ---- Maps: one full-screen map behind the UI, shared by the Pandals and Metro tabs ----
    const sharedMarkers = {};   // Pandals tab: trishul pins
    const dotMarkers = {};      // Metro tab: small dots for the pandals (the train pins are the stations)
    const MAPS = {
      parikrama: { map: null, markers: sharedMarkers, route: null, station: null, selected: null, token: 0 },
      metro:     { map: null, markers: dotMarkers,    route: null, station: null, selected: null, token: 0 }
    };
    let pujoLayer = null;
    let dotLayer = null;
    let sharedMap = null;
    let userMarker = null;
    let activeMapKey = 'parikrama';
    let stationLayer = null;            // metro-station pins, only shown on the Metro tab
    const stationMarkers = {};          // station core name -> marker
    let stationQueueRunning = false;

    function stationCore(metro) {
      return metro.replace(/\s*\(.*?\)\s*/g, '').trim().replace(/\s+Metro$/i, '');
    }

    function ensureStationPin(core, pos) {
      if (stationMarkers[core]) return stationMarkers[core];
      const n = pandals.filter(p => stationCore(p.metro) === core).length;
      const m = L.marker([pos.lat, pos.lng], { icon: pinIcon('metro') });
      m.bindTooltip(core + ' Metro', { direction: 'top' });
      m.bindPopup('<b>' + escapeHtml(core) + ' Metro</b><br>' + n + (n === 1 ? ' pandal' : ' pandals') + ' nearby on this list' +
        '<br><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(core + ' Metro, Kolkata') +
        '" target="_blank" rel="noopener">Open in Maps ↗</a>', { maxWidth: 230 });
      stationMarkers[core] = m;
      if (stationLayer) stationLayer.addLayer(m);
      return m;
    }

    // Adds a train pin for every station. Positions are looked up once (Nominatim allows ~1 request/second)
    // and then cached in the browser, so this is instant on later visits.
    async function loadStationPins() {
      if (stationQueueRunning) return;
      stationQueueRunning = true;
      const status = document.getElementById('metroStatus');
      const BASE = 'Nearest Metro Stations for Pandals \u00b7 tap a pandal to see the walk from its station';
      try {
        const cores = Array.from(new Set(pandals.map(p => stationCore(p.metro))));
        let done = 0;
        for (const core of cores) {
          if (!stationMarkers[core]) {
            const cached = !!geoCache[core];
            if (status && !cached) status.textContent = 'Placing metro stations on the map\u2026 ' + done + '/' + cores.length;
            try {
              const pos = await geocodeStation(core);
              if (pos) ensureStationPin(core, pos);
            } catch (e) { console.warn('Station lookup failed:', core, e); }
            if (!cached) await new Promise(r => setTimeout(r, 1100));
          }
          done++;
        }
        if (status) {
          status.textContent = Object.keys(stationMarkers).length
            ? BASE
            : 'Couldn\u2019t place the metro stations right now \u2014 tap a pandal to try its walking route';
        }
      } finally {
        stationQueueRunning = false;
      }
    }

    // keep the focus area clear of the header (top) and the list panel (bottom)
    function mapPad() {
      const panel = document.querySelector('.view-panel.active .pandal-list-panel');
      const bottom = Math.min((panel ? panel.offsetHeight : 0) + 60, window.innerHeight * 0.55);
      const top = Math.min(140, window.innerHeight * 0.25);
      return { paddingTopLeft: [16, top], paddingBottomRight: [16, bottom] };
    }

    function focusPoint(S, p) {
      S.map.fitBounds([[p.lat, p.lng]], Object.assign({ maxZoom: 16 }, mapPad()));
    }

    function fitAll(key) {
      const S = MAPS[key];
      if (!S.map) return;
      const pts = pandals.map(p => [p.lat, p.lng]);
      // only include the user if they're actually near Kolkata, otherwise the map zooms out to the world
      if (userPos &&
          getDistanceFromLatLonInKm(userPos.lat, userPos.lng, KOLKATA_CENTER[0], KOLKATA_CENTER[1]) < 60) {
        pts.push([userPos.lat, userPos.lng]);
      }
      S.map.fitBounds(pts, Object.assign({ maxZoom: 14 }, mapPad()));
    }

    function updateUserMarker() {
      if (!sharedMap || !userPos) return;
      if (userMarker) {
        userMarker.setLatLng([userPos.lat, userPos.lng]);
      } else {
        userMarker = L.circleMarker([userPos.lat, userPos.lng], {
          radius: 7, color: '#fff', weight: 3, fillColor: '#2f80ed', fillOpacity: 1
        }).addTo(sharedMap).bindTooltip('You are here');
      }
    }

    function ensureMap(key) {
      activeMapKey = key;
      if (typeof L === 'undefined') return;   // Leaflet failed to load

      if (!sharedMap) {
        sharedMap = L.map('bgMap', { zoomControl: false, attributionControl: false });
        L.control.zoom({ position: 'topright' }).addTo(sharedMap);
        L.control.attribution({ position: 'topleft', prefix: false }).addTo(sharedMap);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
        }).addTo(sharedMap);
        sharedMap.setView(KOLKATA_CENTER, 12);
        MAPS.parikrama.map = sharedMap;
        MAPS.metro.map = sharedMap;
        stationLayer = L.layerGroup();

        pujoLayer = L.layerGroup().addTo(sharedMap);
        dotLayer = L.layerGroup();
        tripLayer = L.layerGroup();
        pandals.forEach(p => {
          const m = L.marker([p.lat, p.lng], { icon: pinIcon('pujo') });
          m.bindTooltip(p.name, { direction: 'top' });
          m.on('click', () => selectPandal(activeMapKey, p.id, true));
          pujoLayer.addLayer(m);
          sharedMarkers[p.id] = m;

          const d = L.circleMarker([p.lat, p.lng], { radius: 5, color: '#fff', weight: 2, fillColor: '#A91D22', fillOpacity: 1 });
          d.bindTooltip(p.name, { direction: 'top' });
          d.on('click', () => selectPandal(activeMapKey, p.id, true));
          dotLayer.addLayer(d);
          dotMarkers[p.id] = d;
        });
        updateUserMarker();
      }

      // metro-station pins only belong on the Metro tab
      // each tab owns its own set of layers
      [[pujoLayer, key === 'parikrama'], [dotLayer, key === 'metro'],
       [stationLayer, key === 'metro'], [tripLayer, key === 'trip']].forEach(function (pair) {
        const layer = pair[0], wanted = pair[1];
        if (wanted && !sharedMap.hasLayer(layer)) layer.addTo(sharedMap);
        if (!wanted && sharedMap.hasLayer(layer)) sharedMap.removeLayer(layer);
      });
      if (key === 'metro') loadStationPins();

      // The map was hidden until now, so re-measure it, then show this tab's own state
      setTimeout(() => {
        sharedMap.invalidateSize();
        sharedMap.closePopup();
        clearOverlays(MAPS.parikrama);
        clearOverlays(MAPS.metro);
        if (key === 'trip') { drawTrip(); return; }
        const S = MAPS[key];
        if (S.selected !== null) {
          selectPandal(key, S.selected, false);
        } else {
          styleMarkers(S, -1);
          fitAll(key);
        }
      }, 60);
    }

    function clearOverlays(S) {
      if (S.route) { S.map.removeLayer(S.route); S.route = null; }
      if (S.station) { setPinSelected(S.station, false); S.station = null; }
    }

    function styleMarkers(S, id) {
      Object.keys(S.markers).forEach(k => setPinSelected(S.markers[k], Number(k) === id));
    }

    function highlightCard(key, id, scroll) {
      const cont = document.getElementById(key === 'metro' ? 'metroContainer' : 'pandalContainer');
      cont.querySelectorAll('.pandal-card.selected').forEach(c => c.classList.remove('selected'));
      const card = cont.querySelector('.pandal-card[data-id="' + id + '"]');
      if (card) {
        card.classList.add('selected');
        if (scroll) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function drawRoute(S, geometry, color, dashed) {
      const casing = L.geoJSON(geometry, { style: { color: '#fff', weight: 8, opacity: 0.9 } });
      const line = L.geoJSON(geometry, { style: { color: color, weight: 5, opacity: 0.95, dashArray: dashed ? '2 9' : null, lineCap: 'round' } });
      S.route = L.featureGroup([casing, line]).addTo(S.map);
      return S.route.getBounds();
    }

    async function selectPandal(key, id, fromMap) {
      const S = MAPS[key];
      const p = pandals[id];
      S.selected = id;
      const token = ++S.token;
      highlightCard(key, id, fromMap);
      if (!S.map) return;
      clearOverlays(S);
      styleMarkers(S, id);
      if (key === 'parikrama') await showDrivingRoute(S, p, token);
      else await showMetroWalk(S, p, token);
    }

    // Pandals tab: road route from the user to the pandal
    async function showDrivingRoute(S, p, token) {
      const m = S.markers[p.id];
      const dir = 'https://www.google.com/maps/dir/?api=1' +
        (userPos ? '&origin=' + userPos.lat + ',' + userPos.lng : '') +
        '&destination=' + p.lat + ',' + p.lng + '&travelmode=driving';
      const html = (extra) => '<b>' + escapeHtml(p.name) + '</b><br>' + escapeHtml(p.location) + extra +
        '<br><a href="' + dir + '" target="_blank" rel="noopener">Directions ↗</a>' +
        ' · <a href="#" onclick="addToTrip(' + p.id + '); return false;">+ Add to trip</a>';

      if (!userPos) {
        m.bindPopup(html('<br><i>Allow location to see the road route</i>'), { maxWidth: 220 }).openPopup();
        focusPoint(S, p);
        return;
      }

      m.bindPopup(html('<br><i>Finding route…</i>'), { maxWidth: 220 }).openPopup();
      try {
        const d = await fetchJson('https://router.project-osrm.org/route/v1/driving/' +
          userPos.lng + ',' + userPos.lat + ';' + p.lng + ',' + p.lat + '?overview=full&geometries=geojson');
        if (token !== S.token) return;
        const r = d.routes && d.routes[0];
        if (!r) throw new Error('no route');
        const bounds = drawRoute(S, r.geometry, '#A91D22', false);
        S.map.fitBounds(bounds, Object.assign({ maxZoom: 17 }, mapPad()));
        m.setPopupContent(html('<br>' + formatDist(r.distance / 1000) + ' by road'));
      } catch (err) {
        if (token !== S.token) return;
        console.warn('Route failed:', err);
        m.setPopupContent(html('<br>Couldn’t draw the route'));
        focusPoint(S, p);
      }
    }

    // Metro tab: walking route from the nearest metro station to the pandal
    const GEO_KEY = 'sharadiya_metro_geo_v1';
    let geoCache = {};
    try { geoCache = JSON.parse(localStorage.getItem(GEO_KEY) || '{}'); } catch (e) {}

    const geoInflight = {};
    function geocodeStation(core) {
      if (geoCache[core]) return Promise.resolve(geoCache[core]);
      if (!geoInflight[core]) {
        geoInflight[core] = geocodeStationRaw(core).finally(() => { delete geoInflight[core]; });
      }
      return geoInflight[core];
    }

    async function geocodeStationRaw(core) {
      if (geoCache[core]) return geoCache[core];
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6' +
        '&viewbox=88.20,22.75,88.55,22.35&bounded=1&q=' + encodeURIComponent(core + ' metro station');
      const res = await fetchJson(url);
      const hit = (res || []).find(r => r.category === 'railway' || r.category === 'public_transport');
      if (!hit) return null;
      const pos = { lat: parseFloat(hit.lat), lng: parseFloat(hit.lon) };
      geoCache[core] = pos;
      try { localStorage.setItem(GEO_KEY, JSON.stringify(geoCache)); } catch (e) {}
      return pos;
    }

    async function showMetroWalk(S, p, token) {
      const m = S.markers[p.id];
      const stationName = p.metro.replace(/\s*\(.*?\)\s*/g, '').trim();   // drops the "(Orange Line…)" note
      const core = stationName.replace(/\s+Metro$/i, '');
      const dir = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(stationName + ', Kolkata') +
        '&destination=' + p.lat + ',' + p.lng + '&travelmode=walking';
      const base = '<b>' + escapeHtml(p.name) + '</b><br>Nearest metro: ' + escapeHtml(p.metro);
      const link = '<br><a href="' + dir + '" target="_blank" rel="noopener">Walking directions ↗</a>' +
        ' · <a href="#" onclick="addToTrip(' + p.id + '); return false;">+ Add to trip</a>';

      m.bindPopup(base + '<br><i>Finding walking route…</i>', { maxWidth: 230 }).openPopup();
      focusPoint(S, p);

      try {
        const st = await geocodeStation(core);
        if (token !== S.token) return;
        if (!st) throw new Error('station not found');

        const sm = ensureStationPin(core, st);
        setPinSelected(sm, true);
        S.station = sm;

        const d = await fetchJson('https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
          st.lng + ',' + st.lat + ';' + p.lng + ',' + p.lat + '?overview=full&geometries=geojson');
        if (token !== S.token) return;
        const r = d.routes && d.routes[0];
        if (!r) throw new Error('no walking route');

        const bounds = drawRoute(S, r.geometry, '#2f80ed', true);
        S.map.fitBounds(bounds, Object.assign({ maxZoom: 17 }, mapPad()));

        const km = r.distance / 1000;
        const mins = Math.max(1, Math.round(r.duration / 60));
        walkInfo[p.id] = { km: km, mins: mins };
        m.setPopupContent(base + '<br>' + formatDist(km) + ' walk from the station (~' + mins + ' min)' + link);

        const line = document.querySelector('#metroContainer .pandal-card[data-id="' + p.id + '"] p');
        if (line && !line.querySelector('.walk-info')) line.insertAdjacentHTML('beforeend', walkHtml(p.id));
      } catch (err) {
        if (token !== S.token) return;
        console.warn('Metro walk failed:', err);
        m.setPopupContent(base + '<br>Couldn’t draw the walking route.' + link);
      }
    }

    function walkHtml(id) {
      const w = walkInfo[id];
      return w ? '<span class="walk-info"><br><span style="color:var(--accent-gold); font-weight:600;">' +
        formatDist(w.km) + ' walk · ~' + w.mins + ' min</span></span>' : '';
    }


    // ================= Trip planner =================
    const TRIP_KEY = 'sharadiya_trip_v1';
    const trip = { stops: [], sub: 'add', useMe: false, legs: null, legsRoad: false };
    let tripLayer = null;
    let tripToken = 0;
    let tripDrawTimer = null;
    let tripNoteText = '';
    let tripNoteTimer = null;
    let toastTimer = null;

    function loadTrip() {
      try {
        const saved = JSON.parse(localStorage.getItem(TRIP_KEY) || 'null');
        if (saved && Array.isArray(saved.stops)) {
          trip.stops = saved.stops.filter((id, i, arr) => Number.isInteger(id) && pandals[id] && arr.indexOf(id) === i);
        }
      } catch (e) {}
      trip.sub = trip.stops.length ? 'plan' : 'add';
    }
    function saveTrip() {
      try { localStorage.setItem(TRIP_KEY, JSON.stringify({ stops: trip.stops })); } catch (e) {}
    }

    function showToast(msg) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function setTripNote(msg) {
      tripNoteText = msg;
      clearTimeout(tripNoteTimer);
      tripNoteTimer = setTimeout(() => { tripNoteText = ''; updateTripSummary(); }, 3500);
      updateTripSummary();
    }

    function tripMeOn() { return trip.useMe && !!userPos; }

    // the route's points in order: optional start (you) + every stop
    function tripPoints() {
      const pts = [];
      if (tripMeOn()) pts.push({ label: 'You', lat: userPos.lat, lng: userPos.lng, me: true });
      trip.stops.forEach(id => pts.push({ label: pandals[id].name, lat: pandals[id].lat, lng: pandals[id].lng, id: id }));
      return pts;
    }

    function afterTripChange() {
      trip.legs = null;
      saveTrip();
      renderTrip();
      clearTimeout(tripDrawTimer);
      tripDrawTimer = setTimeout(drawTrip, 250);
    }

    function addToTrip(id) {
      if (trip.stops.indexOf(id) !== -1) { showToast(pandals[id].name + ' is already in your trip'); return; }
      trip.stops.push(id);
      showToast('Added ' + pandals[id].name + ' · ' + trip.stops.length + (trip.stops.length === 1 ? ' stop' : ' stops'));
      afterTripChange();
    }
    function removeStop(i) {
      trip.stops.splice(i, 1);
      afterTripChange();
    }
    function moveStop(i, dir) {
      const j = i + dir;
      if (j < 0 || j >= trip.stops.length) return;
      const tmp = trip.stops[i]; trip.stops[i] = trip.stops[j]; trip.stops[j] = tmp;
      afterTripChange();
    }
    function toggleTripStop(id) {
      const i = trip.stops.indexOf(id);
      if (i === -1) addToTrip(id); else removeStop(i);
    }
    function clearTrip() {
      if (!trip.stops.length) return;
      if (!window.confirm('Remove all stops from your trip?')) return;
      trip.stops = [];
      trip.sub = 'add';
      afterTripChange();
    }
    function setTripSub(sub) {
      trip.sub = sub;
      renderTrip();
    }

    function toggleUseMe() {
      if (trip.useMe) { trip.useMe = false; afterTripChange(); return; }
      if (userPos) { trip.useMe = true; afterTripChange(); return; }
      if (!('geolocation' in navigator)) { setTripNote('Location isn’t available on this device'); return; }
      setTripNote('Finding your location…');
      navigator.geolocation.getCurrentPosition(function (position) {
        userPos = { lat: position.coords.latitude, lng: position.coords.longitude };
        updateUserMarker();
        trip.useMe = true;
        setTripNote('Starting from your location');
        afterTripChange();
      }, function () {
        setTripNote('Couldn’t get your location — check the browser permission');
      }, { timeout: 10000, maximumAge: 60000 });
    }

    function focusTripStop(id) {
      if (!sharedMap) return;
      const p = pandals[id];
      sharedMap.fitBounds([[p.lat, p.lng]], Object.assign({ maxZoom: 16 }, mapPad()));
    }

    // ---- ordering: nearest-next, starting from you (if on) or the first stop ----
    function greedyOrder(d) {
      const n = d.length, order = [0], seen = new Set([0]);
      while (order.length < n) {
        const last = order[order.length - 1];
        let best = -1, bd = Infinity;
        for (let j = 0; j < n; j++) {
          if (!seen.has(j) && d[last][j] < bd) { bd = d[last][j]; best = j; }
        }
        if (best < 0) { for (let j = 0; j < n; j++) { if (!seen.has(j)) { best = j; break; } } }
        order.push(best); seen.add(best);
      }
      return order;
    }

    async function optimiseTrip() {
      if (trip.stops.length < 2) return;
      const pts = tripPoints();
      setTripNote('Finding a shorter order…');
      let d;
      try {
        const coords = pts.map(p => p.lng + ',' + p.lat).join(';');
        const res = await fetchJson('https://router.project-osrm.org/table/v1/driving/' + coords + '?annotations=distance', 12000);
        if (res.code !== 'Ok' || !res.distances) throw new Error('table');
        d = res.distances.map((row, i) => row.map((m, j) => typeof m === 'number'
          ? m / 1000 : getDistanceFromLatLonInKm(pts[i].lat, pts[i].lng, pts[j].lat, pts[j].lng)));
      } catch (e) {
        d = pts.map(a => pts.map(b => getDistanceFromLatLonInKm(a.lat, a.lng, b.lat, b.lng)));
      }
      const order = greedyOrder(d);
      trip.stops = order.filter(i => !pts[i].me).map(i => pts[i].id);
      setTripNote(pts[0].me ? 'Reordered — nearest stop first, starting from you'
                            : 'Reordered — nearest next, keeping your first stop as the start');
      afterTripChange();
    }

    // ---- sharing ----
    function tripMapsUrl() {
      const pts = tripPoints();
      if (pts.length < 2) return null;
      const f = p => p.lat + ',' + p.lng;
      const middle = pts.slice(1, -1);
      const mid = middle.slice(0, 9).map(f).join('|');
      if (middle.length > 9) setTripNote('Google Maps takes up to 9 middle stops — the link leaves out the extras');
      return 'https://www.google.com/maps/dir/?api=1&origin=' + f(pts[0]) + '&destination=' + f(pts[pts.length - 1]) +
        (mid ? '&waypoints=' + encodeURIComponent(mid) : '') + '&travelmode=driving';
    }

    function openTripInMaps() {
      const url = tripMapsUrl();
      if (url) window.open(url, '_blank', 'noopener');
    }

    function copyTripPlan() {
      if (!trip.stops.length) return;
      const pts = tripPoints();
      const meOn = tripMeOn();
      const lines = ['My Pujo trip (sharadiya.diy)', ''];
      trip.stops.forEach((id, s) => {
        const p = pandals[id];
        const legIdx = s - 1 + (meOn ? 1 : 0);
        if (legIdx >= 0 && trip.legs && trip.legs[legIdx] != null) {
          lines.push('   ↓ ' + formatDist(trip.legs[legIdx]) + (trip.legsRoad ? ' by road' : ' straight-line'));
        }
        lines.push((s + 1) + '. ' + p.name + ' (' + p.location + ') — Metro: ' + p.metro);
      });
      const url = tripMapsUrl();
      if (url) lines.push('', 'Route: ' + url);
      const text = lines.join('\n');
      const done = () => showToast('Trip plan copied');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => window.prompt('Copy your trip plan:', text));
      } else {
        window.prompt('Copy your trip plan:', text);
      }
    }

    // ---- rendering the panel ----
    function tripTotalKm() {
      return trip.legs ? trip.legs.reduce((a, b) => a + b, 0) : null;
    }

    function updateTripSummary() {
      const el = document.getElementById('tripSummary');
      if (!el) return;
      const n = trip.stops.length;
      const total = tripTotalKm();
      let text;
      if (tripNoteText) text = tripNoteText;
      else if (!n) text = 'Plan your pandal hopping — add the pandals you want to visit, then arrange the order.';
      else if (total !== null) text = n + (n === 1 ? ' stop' : ' stops') + ' · ' + formatDist(total) + (trip.legsRoad ? ' by road' : ' straight-line') + ' in total';
      else text = n + (n === 1 ? ' stop' : ' stops') + (tripPoints().length < 2 ? ' — add one more to see the route' : '');
      el.textContent = text;
    }

    function renderTrip() {
      const n = trip.stops.length;
      const tabPlan = document.getElementById('tripTabPlan');
      const tabAdd = document.getElementById('tripTabAdd');
      if (!tabPlan) return;
      tabPlan.textContent = 'My trip (' + n + ')';
      tabPlan.classList.toggle('on', trip.sub === 'plan');
      tabAdd.classList.toggle('on', trip.sub === 'add');
      document.getElementById('tripPlanBox').style.display = trip.sub === 'plan' ? 'block' : 'none';
      document.getElementById('tripAddBox').style.display = trip.sub === 'add' ? 'block' : 'none';
      updateTripSummary();
      if (trip.sub === 'plan') renderTripPlan(); else renderTripAdd();
    }

    function renderTripPlan() {
      const pts = tripPoints();
      const meOn = tripMeOn();
      const n = trip.stops.length;

      document.getElementById('tripActions').innerHTML =
        '<button type="button" class="chip' + (trip.useMe ? ' on' : '') + '" onclick="toggleUseMe()">Start from my location</button>' +
        '<button type="button" class="chip" onclick="optimiseTrip()"' + (n < 2 ? ' disabled' : '') + '>Best order</button>' +
        '<button type="button" class="chip" onclick="openTripInMaps()"' + (pts.length < 2 ? ' disabled' : '') + '>Open in Maps</button>' +
        '<button type="button" class="chip" onclick="copyTripPlan()"' + (n < 1 ? ' disabled' : '') + '>Copy plan</button>' +
        '<button type="button" class="chip" onclick="clearTrip()"' + (n < 1 ? ' disabled' : '') + '>Clear</button>';

      const box = document.getElementById('tripStops');
      if (!n) {
        box.innerHTML = '<div class="trip-empty">No stops yet. Tap “+ Add pandals” to choose where you want to go.</div>';
        return;
      }
      box.innerHTML = trip.stops.map((id, s) => {
        const p = pandals[id];
        const legIdx = s - 1 + (meOn ? 1 : 0);
        let leg = '';
        if (legIdx >= 0 && pts[legIdx + 1]) {
          const a = pts[legIdx], b = pts[legIdx + 1];
          const km = trip.legs && trip.legs[legIdx] != null ? trip.legs[legIdx] : null;
          const dist = km === null ? 'Calculating…' : formatDist(km) + (trip.legsRoad ? ' by road' : ' straight-line');
          const base = 'https://www.google.com/maps/dir/?api=1&origin=' + a.lat + ',' + a.lng + '&destination=' + b.lat + ',' + b.lng + '&travelmode=';
          leg = '<div class="trip-leg">↓ ' + (a.me ? 'From your location · ' : '') + dist +
            ' · <a href="' + base + 'transit" target="_blank" rel="noopener">By metro / transit ↗</a>' +
            ' · <a href="' + base + 'driving" target="_blank" rel="noopener">Drive ↗</a></div>';
        }
        return leg + `
        <div class="pandal-card selectable trip-stop" onclick="focusTripStop(${id})">
          <div class="trip-badge">${s + 1}</div>
          <div class="trip-body">
            <h4>${p.name}</h4>
            <p>${p.location}<br><span style="color:var(--accent-gold); font-weight:600;">Nearest Metro:</span> ${p.metro}</p>
          </div>
          <div class="trip-ctl">
            <button type="button" class="icon-btn" aria-label="Move up" onclick="event.stopPropagation(); moveStop(${s}, -1)"${s === 0 ? ' disabled' : ''}>▲</button>
            <button type="button" class="icon-btn" aria-label="Move down" onclick="event.stopPropagation(); moveStop(${s}, 1)"${s === n - 1 ? ' disabled' : ''}>▼</button>
            <button type="button" class="icon-btn" aria-label="Remove" onclick="event.stopPropagation(); removeStop(${s})">×</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderTripAdd() {
      const q = document.getElementById('tripSearch').value;
      let list = filterPandals(pandals, q);
      const haveDist = typeof pandals[0].distance === 'number' && userPos;
      list = list.slice().sort(haveDist
        ? (a, b) => a.distance - b.distance
        : (a, b) => a.name.localeCompare(b.name));
      document.getElementById('tripAddList').innerHTML = list.length ? list.map(p => {
        const inTrip = trip.stops.indexOf(p.id) !== -1;
        const dist = haveDist ? ' · ' + formatDist(p.distance) + (p.isRoad ? ' by road' : '') : '';
        return `
        <div class="pandal-card selectable${inTrip ? ' selected' : ''}" onclick="toggleTripStop(${p.id})">
          <div>
            <h4>${p.name}</h4>
            <p>${p.location}${dist}<br><span style="color:var(--accent-gold); font-weight:600;">Metro:</span> ${p.metro}</p>
          </div>
          <span class="chip${inTrip ? ' on' : ''}">${inTrip ? 'Added ✓' : '+ Add'}</span>
        </div>`;
      }).join('') : emptyResultHtml(q);
    }

    // ---- drawing the trip on the map ----
    function tripNumIcon(n) {
      return L.divIcon({
        className: 'trip-num-wrap', html: '<div class="trip-num">' + n + '</div>',
        iconSize: [30, 30], iconAnchor: [15, 15]
      });
    }

    function stationMarkerFor(core, pos) {
      const m = L.marker([pos.lat, pos.lng], { icon: pinIcon('metro') });
      m.bindTooltip(core + ' Metro', { direction: 'top' });
      m.bindPopup('<b>' + escapeHtml(core) + ' Metro</b><br><a href="https://www.google.com/maps/search/?api=1&query=' +
        encodeURIComponent(core + ' Metro, Kolkata') + '" target="_blank" rel="noopener">Open in Maps ↗</a>', { maxWidth: 220 });
      return m;
    }

    // train pins for the stations nearest to your stops (looked up politely, then cached)
    async function addTripStations(token) {
      const cores = Array.from(new Set(trip.stops.map(id => stationCore(pandals[id].metro))));
      for (const core of cores) {
        if (token !== tripToken) return;
        const cached = !!geoCache[core];
        try {
          const pos = await geocodeStation(core);
          if (token !== tripToken) return;
          if (pos) stationMarkerFor(core, pos).addTo(tripLayer);
        } catch (e) { console.warn('Trip station lookup failed:', core, e); }
        if (!cached) await new Promise(r => setTimeout(r, 1100));
      }
    }

    function fitTrip(pts) {
      if (!sharedMap || !pts.length) return;
      sharedMap.fitBounds(pts.map(p => [p.lat, p.lng]), Object.assign({ maxZoom: 15 }, mapPad()));
    }

    async function drawTrip() {
      if (!sharedMap || !tripLayer || activeMapKey !== 'trip') return;
      const token = ++tripToken;
      tripLayer.clearLayers();
      const pts = tripPoints();

      let num = 0;
      pts.forEach(pt => {
        if (pt.me) {
          L.circleMarker([pt.lat, pt.lng], { radius: 7, color: '#fff', weight: 3, fillColor: '#2f80ed', fillOpacity: 1 })
            .addTo(tripLayer).bindTooltip('Start: your location');
        } else {
          num++;
          L.marker([pt.lat, pt.lng], { icon: tripNumIcon(num), zIndexOffset: 500 })
            .addTo(tripLayer).bindTooltip(num + '. ' + pt.label, { direction: 'top', offset: [0, -14] });
        }
      });
      addTripStations(token);

      if (pts.length < 2) {
        trip.legs = null;
        updateTripSummary();
        fitTrip(pts);
        return;
      }

      let geometry, legs, road = false;
      try {
        const coords = pts.map(p => p.lng + ',' + p.lat).join(';');
        const d = await fetchJson('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson', 12000);
        const r = d.routes && d.routes[0];
        if (!r || !r.legs || r.legs.length !== pts.length - 1) throw new Error('no route');
        geometry = r.geometry;
        legs = r.legs.map(l => l.distance / 1000);
        road = true;
      } catch (err) {
        console.warn('Trip route unavailable, using straight lines:', err);
        geometry = { type: 'LineString', coordinates: pts.map(p => [p.lng, p.lat]) };
        legs = pts.slice(1).map((p, i) => getDistanceFromLatLonInKm(pts[i].lat, pts[i].lng, p.lat, p.lng));
      }
      if (token !== tripToken) return;

      L.geoJSON(geometry, { style: { color: '#fff', weight: 8, opacity: 0.9 } }).addTo(tripLayer);
      L.geoJSON(geometry, { style: { color: '#A91D22', weight: 5, opacity: 0.95, dashArray: road ? null : '6 8', lineCap: 'round' } }).addTo(tripLayer);

      trip.legs = legs;
      trip.legsRoad = road;
      renderTrip();
      fitTrip(pts);
    }

    loadTrip();
    renderTrip();

    // ---- Search helpers (Pandals + Metro tabs) ----
    let currentPandalList = pandals; // last list shown (keeps the nearest-first order after location loads)

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // Every word typed must appear somewhere in name / area / metro station.
    function filterPandals(list, query) {
      const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
      if (!tokens.length) return list;
      return list.filter(p => {
        const hay = `${p.name} ${p.location} ${p.metro}`.toLowerCase();
        return tokens.every(t => hay.includes(t));
      });
    }

    function emptyResultHtml(query) {
      return `<div class="search-empty">No results for \u201C${escapeHtml(query.trim())}\u201D</div>`;
    }

    function toggleClearBtn(inputId, btnId) {
      document.getElementById(btnId).classList.toggle('show', document.getElementById(inputId).value.length > 0);
    }

    function onPandalSearch() {
      toggleClearBtn('pandalSearch', 'pandalSearchClear');
      renderPandals(currentPandalList);
    }
    function onMetroSearch() {
      toggleClearBtn('metroSearch', 'metroSearchClear');
      renderMetroList();
    }
    function clearSearch(which) {
      const inputId = which === 'metro' ? 'metroSearch' : 'pandalSearch';
      const btnId = which === 'metro' ? 'metroSearchClear' : 'pandalSearchClear';
      const input = document.getElementById(inputId);
      input.value = '';
      toggleClearBtn(inputId, btnId);
      if (which === 'metro') renderMetroList(); else renderPandals(currentPandalList);
      input.focus();
    }

    function renderPandals(list) {
      currentPandalList = list;
      const query = document.getElementById('pandalSearch').value;
      const shown = filterPandals(list, query);
      const selId = MAPS.parikrama.selected;
      document.getElementById('pandalContainer').innerHTML = shown.length ? shown.map(p => {
        let distText = '';
        if (typeof p.distance === 'number') {
          distText = `<br><span style="color:var(--accent-gold); font-weight:600;">${formatDist(p.distance)} ${p.isRoad ? 'by road' : 'straight-line'}</span>`;
        }
        return `
        <div class="pandal-card selectable${p.id === selId ? ' selected' : ''}" data-id="${p.id}" onclick="selectPandal('parikrama', ${p.id})">
          <div><h4>${p.name}</h4><p>${p.location} ${distText}</p></div>
          <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" rel="noopener" class="route-btn" onclick="event.stopPropagation()">Map</a>
        </div>`;
      }).join('') : emptyResultHtml(query);
    }

    function renderMetroList() {
      const query = document.getElementById('metroSearch').value;
      const shown = filterPandals(pandals, query);
      const selId = MAPS.metro.selected;
      document.getElementById('metroContainer').innerHTML = shown.length ? shown.map(p => {
        const metroQuery = encodeURIComponent(p.metro + ', Kolkata');
        return `
        <div class="pandal-card selectable${p.id === selId ? ' selected' : ''}" data-id="${p.id}" onclick="selectPandal('metro', ${p.id})">
          <div>
             <h4 style="margin-bottom: 4px;">${p.name}</h4>
             <p><span style="color:var(--accent-gold); font-weight:600;">Nearest Metro:</span> ${p.metro}${walkHtml(p.id)}</p>
          </div>
          <a href="https://maps.google.com/?q=${metroQuery}" target="_blank" rel="noopener" class="route-btn" onclick="event.stopPropagation()">Map</a>
        </div>`;
      }).join('') : emptyResultHtml(query);
    }
  </script>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) e.preventDefault();
    });
  </script>

      signInAnonymously(auth).catch((err) => console.warn('Presence sign-in failed:', err.message));

      onAuthStateChanged(auth, (user) => {
        if (!user) return;
        const myStatusRef = ref(db, 'status/' + user.uid);

        onValue(connectedRef, (snap) => {
          if (snap.val() === false) return;
          onDisconnect(myStatusRef).remove().then(() => {
            set(myStatusRef, true);
          });

      onValue(ref(db, 'status'), (snapshot) => {
        const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
        if (onlineCountEl) onlineCountEl.textContent = count;
      });
    } catch (err) {
      console.warn('Online counter not active — add your Firebase config to enable it.', err);

  </script>
