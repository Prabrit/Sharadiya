  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --accent-gold: #D4AF37;
      --primary-crimson: #A91D22;

      --surface-container: rgba(32, 14, 16, 0.4);
      --surface-container-high: rgba(48, 18, 21, 0.5);
      --state-hover: rgba(255, 255, 255, 0.08);
      --state-press: rgba(255, 255, 255, 0.14);
      --elevation-2: 0 1px 3px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.28);
      --elevation-4: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
      overscroll-behavior: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
    }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
    }

    .ui-container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      overflow: hidden;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-shrink: 0; }

    .note-pill {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
      padding: 7px 16px 7px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      color: #fff; text-decoration: none; cursor: pointer; overflow: hidden;
      transition: background .2s ease, transform .2s ease;
    }
    .note-pill:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
    .note-icon { color: var(--accent-gold); filter: drop-shadow(0 0 4px rgba(212,175,55,.6)); flex-shrink: 0; }

    .clock-container { display: flex; flex-direction: column; align-items: flex-end; }
    .clock { font-weight: 500; font-size: 0.9rem; letter-spacing: 1px; }

    .countdown-bar {
      font-family: 'Tiro Bangla', serif;
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      color: var(--accent-gold);
      margin-top: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .center-title {
      flex-shrink: 0;
      text-align: center; width: 100%; max-width: 500px;
      margin: clamp(8px, 4vh, 32px) auto 0;
    }
    .bengali-title { font-family: 'Tiro Bangla', serif; font-size: clamp(2.4rem, 11vw, 4.8rem); text-shadow: 2px 4px 12px rgba(0,0,0,0.4); margin-bottom: -6px; line-height: 1.05;}
    .english-subtitle { font-size: clamp(0.85rem, 2.6vw, 1.1rem); letter-spacing: 4px; opacity: 0.9; margin-bottom: clamp(14px, 3vh, 25px); }

    .view-switcher {
      display: flex; justify-content: center; align-items: center; gap: 4px; flex-wrap: nowrap;
      background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px);
      padding: 5px; border-radius: 30px; border: 1px solid var(--glass-border);
      max-width: 100%; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
    }
    .view-switcher::-webkit-scrollbar { display: none; }
    .switch-btn {
      position: relative; overflow: hidden; flex-shrink: 0;
      background: none; border: none; color: var(--text-muted);
      padding: 8px 12px; border-radius: 20px; font-weight: 600;
      font-size: clamp(0.72rem, 2.6vw, 0.85rem); white-space: nowrap; cursor: pointer; transition: all 0.3s;
    }
    .switch-btn.active { background: rgba(255, 255, 255, 0.15); color: #FFF; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .bottom-area {
      margin-top: auto; display: flex; flex-direction: column; gap: 12px;
      max-width: 650px; margin-left: auto; margin-right: auto; width: 100%;
      min-height: 0;
    }

    .views-wrapper { width: 100%; min-height: 0; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .glass-player {
      background: linear-gradient(160deg, var(--surface-container-high), var(--surface-container));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 28px;
      padding: 12px 14px 12px 12px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--elevation-4);
    }
    .album-art {
      width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0;
      background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=200&auto=format&fit=crop') center/cover;
      box-shadow: var(--elevation-2); transition: background-image 0.5s ease;
    }
    .player-controls { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .track-info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; }
    .track-title { font-weight: 600; font-size: .92rem; letter-spacing: .1px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-time { color: var(--text-muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }

    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; position: relative; cursor: pointer;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--accent-gold);
      border-radius: 2px; position: relative; transition: width 0.5s linear;
    }
    .progress-fill::after {
      content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent-gold);
      box-shadow: 0 0 6px rgba(212,175,55,.7);
    }

    .btn-row { display: flex; align-items: center; gap: 8px; }

    .ctrl-btn {
      position: relative; overflow: hidden;
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: white; cursor: pointer;
      opacity: 0.85; font-size: 1.1rem; transition: background .2s ease, opacity .2s ease;
    }
    .ctrl-btn:hover { background: var(--state-hover); opacity: 1; }

    .play-btn {
      position: relative; overflow: hidden;
      width: 50px; height: 50px; background: var(--accent-gold); color: #2A1400; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding-left: 3px;
      box-shadow: var(--elevation-2); transition: transform .15s ease, box-shadow .2s ease;
    }

    .menu-btn {
      position: relative; overflow: hidden;
      background: rgba(255,255,255,0.05); border: none;
      color: white; width: 44px; height: 62px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s; flex-shrink: 0; font-size: 1.2rem;
    }

    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      background: rgba(255,255,255,.5); animation: ripple-anim .55s ease-out; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(2.8); opacity: 0; } }

    .pandal-list-panel {
      background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 18px; max-height: min(280px, 32vh); overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .pandal-list-panel::-webkit-scrollbar { width: 6px; }
    .pandal-list-panel::-webkit-scrollbar-track { background: transparent; }
    .pandal-list-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .pandal-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: rgba(0,0,0,0.2);
      border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
    }
    .pandal-card h4 { font-size: 0.95rem; }
    .pandal-card p { font-size: 0.8rem; color: var(--text-muted); }
    .route-btn { background: var(--primary-crimson); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; flex-shrink: 0;}

    .pandal-card.mahalaya-card { cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .pandal-card.mahalaya-card:hover { background: rgba(0,0,0,0.32); }
    .pandal-card.mahalaya-card.playing { background: rgba(212, 175, 55, 0.18); border-color: var(--accent-gold); }
    .mahalaya-play-btn {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--accent-gold); color: #2A1400; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding-left: 2px;
    }
    .pandal-card.mahalaya-card.playing .mahalaya-play-btn { padding-left: 0; }

    .footer {
      flex-shrink: 0;
      text-align: center; margin-top: 10px;
      font-size: 0.78rem; font-weight: 500; color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .drawer {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 600px; height: 42vh; max-height: 360px;
      background: rgba(18, 8, 10, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-bottom: none; z-index: 10;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 14px 18px; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
    }
    .drawer.open { bottom: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08);}
    .drawer-header h3 { font-size: 0.95rem; font-weight: 600; }
    .close-btn { background: none; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; opacity: 0.8; }
    .close-btn:hover { opacity: 1; }

    .playlist-items { 
      overflow-y: auto; 
      flex: 1;
      display: flex; flex-direction: column; gap: 6px; 
      padding-bottom: 10px;
      padding-right: 4px;
    }
    
    .playlist-items::-webkit-scrollbar { width: 4px; }
    .playlist-items::-webkit-scrollbar-track { background: transparent; }
    .playlist-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .playlist-item {
      position: relative; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      background: rgba(255,255,255,0.03); border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .playlist-item:hover { background: rgba(255,255,255,0.1); border-color: var(--glass-border); }
    .playlist-item.active { background: rgba(212, 175, 55, 0.25); border-color: var(--accent-gold); }
    .playlist-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
    .playlist-info h5 { font-size: 0.82rem; font-weight: 600; line-height: 1.2; }
    .playlist-info p { font-size: 0.7rem; color: var(--text-muted); }

    
    @media (max-height: 700px) {
      .center-title { margin-top: clamp(6px, 2vh, 16px); }
      .english-subtitle { margin-bottom: clamp(8px, 1.6vh, 14px); }
      .countdown-bar { margin-top: 6px; }
      .bottom-area { gap: 8px; }
      .pandal-list-panel { max-height: min(220px, 30vh); padding: 14px; }
    }
    @media (max-height: 520px) {
      .center-title { margin-top: 4px; }
      .bengali-title { font-size: clamp(1.8rem, 9vw, 2.6rem); }
      .english-subtitle { font-size: 0.75rem; margin-bottom: 6px; }
      .countdown-bar { display: none; }
      .glass-player { padding: 8px 10px; gap: 10px; }
      .album-art { width: 46px; height: 46px; }
    }

    
    @media (max-width: 300px), (max-height: 340px) {
      .ui-container {
        padding-top: max(14px, env(safe-area-inset-top));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
        padding-left: max(20px, 14%);
        padding-right: max(20px, 14%);
      }
      .note-pill span { display: none; }
      .note-pill { padding: 6px; }
      .clock { font-size: 0.65rem; }
      .bengali-title { font-size: clamp(1.2rem, 15vw, 1.7rem); }
      .english-subtitle { font-size: 0.56rem; letter-spacing: 1.5px; margin-bottom: 6px; }
      .view-switcher { padding: 3px; gap: 2px; }
      .switch-btn { padding: 5px 7px; font-size: 0.56rem; }
      .glass-player { padding: 6px 8px; gap: 6px; border-radius: 16px; }
      .album-art { width: 30px; height: 30px; border-radius: 9px; }
      .track-title { max-width: 68px; font-size: 0.62rem; }
      .track-time { display: none; }
      .ctrl-btn { width: 26px; height: 26px; font-size: 0.78rem; }
      .play-btn { width: 32px; height: 32px; }
      .menu-btn { width: 26px; height: 40px; font-size: 0.78rem; }
      .footer { font-size: 0.52rem; margin-top: 8px; }
      .pandal-list-panel { padding: 8px; max-height: 34vh; }
      .pandal-card { padding: 6px; gap: 6px; }
      .pandal-card h4 { font-size: 0.66rem; line-height: 1.15; }
      .pandal-card p { font-size: 0.56rem; }
      .route-btn { padding: 4px 6px; font-size: 0.56rem; }
      .mahalaya-play-btn { width: 28px; height: 28px; font-size: 0.75rem; }
    }

  </style>
</head>
<body>

  <audio id="mainAudio" preload="metadata" playsinline></audio>

  <div class="overlay"></div>

  <div class="ui-container">
    <nav class="top-bar">
      <a href="message.html" target="_blank" class="note-pill" onclick="rippleNav(event)" title="A little note from Prabrit">

        <button class="switch-btn" onclick="switchMode('mahalaya', this, event)">Mahalaya</button>
        <button class="switch-btn active" onclick="switchMode('player', this, event)">Music</button>

    <div class="bottom-area">
      <div class="views-wrapper">
        
        
        <div id="playerView" class="view-panel active">
          <div class="glass-player">
            <div class="album-art" id="albumArt"></div>
            <div class="player-controls">
              <div class="track-info-row">
                <span class="track-title" id="trackTitle">Loading Pujo Vibe...</span>

    <div class="footer">Made by prabrit with love ❤️</div>
  </div>

        Hit Play to load the tracklist...
      </div>
    </div>
  </div>

  <script>
    
    
    
    const playlists = {

      ],

        { title: "Mahalaya (Mahishasura Mardini)", src: "mahalaya/Mahalaya (Mahishasura Mardini).mp3", art: "mahalaya.jpg" }
      ]
    };

    const audio = document.getElementById('mainAudio');
    let activeList = 'pujo';           
    let currentIndex = 0;
    let isPlaying = false;
    let wakeLock = null;              

    const bgImages = ['Sakti.png','chokhudan.jpg', 'alo.jpg', 'dristi.png', 'poribar.jpg' , 'prem.png' , 'pujoalo.jpg' , 'sobarpujo.jpg' ]; 
    let bgIndex = 0;

    function updateBackground() {
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const isLaptop = window.innerWidth > 768;

      if (isLandscape || isLaptop) {
        document.body.style.backgroundImage = `url('pujo.png ')`;
      } else {
        document.body.style.backgroundImage = `url('${bgImages[bgIndex]}')`;
      }
    }

    function rotateBackground() {
      bgIndex = (bgIndex + 1) % bgImages.length;
      updateBackground();
    }
    
    setInterval(rotateBackground, 600000);
    window.addEventListener('resize', updateBackground);
    updateBackground();

   
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {
        wakeLock = null;
      }
    }

    function releaseWakeLock() {
      try {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
      } catch (e) {}
    }

    
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isPlaying) {
        await requestWakeLock();
      }
    });

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined) audio.currentTime = details.seekTime;
        });
      } catch (e) {}
    }

    function updateMediaSessionMetadata(track) {
      if (!('mediaSession' in navigator) || !track) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title || 'Sharadiya Sangeet',
        artist: 'Pujo Playlist • Sharadiya',
        album: 'শারদীয়া',
        artwork: [{ src: track.art, sizes: '512x512', type: 'image/jpeg' }]
      });
    }

    function loadTrack(listKey, index, autoplay) {
      const list = playlists[listKey];
      activeList = listKey;
      currentIndex = (index + list.length) % list.length;
      const track = list[currentIndex];
      audio.src = track.src;
      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('albumArt').style.backgroundImage = `url('${track.art}')`;
      updateMediaSessionMetadata(track);
      highlightActiveTrackInDrawer();
      highlightActiveMahalayaItem();
      if (autoplay) audio.play().catch(() => {});
    }

    function togglePlay(e) {
      if (e) addRipple(e, true);
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function nextTrack(e) { if (e) addRipple(e); loadTrack(activeList, currentIndex + 1, true); }
    function prevTrack(e) { if (e) addRipple(e); loadTrack(activeList, currentIndex - 1, true); }

    
    audio.addEventListener('play', () => {
      isPlaying = true;
      const playBtn = document.getElementById('mainPlayBtn');
      playBtn.innerText = '❚❚';
      playBtn.style.paddingLeft = '0';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      requestWakeLock();
      highlightActiveMahalayaItem();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      const playBtn = document.getElementById('mainPlayBtn');
      playBtn.innerText = '▶';
      playBtn.style.paddingLeft = '3px';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      releaseWakeLock();
      highlightActiveMahalayaItem();
    });

    audio.addEventListener('ended', () => nextTrack());

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration) * 100 + '%';
        document.getElementById('trackTime').innerText = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
      }
    });

    document.getElementById('progressBar').addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    function highlightActiveTrackInDrawer() {
      document.querySelectorAll('.playlist-item').forEach((item, index) => {

    function highlightActiveMahalayaItem() {
      playlists.mahalaya.forEach((t, index) => {

        const isCurrent = activeList === 'mahalaya' && index === currentIndex;
        card.classList.toggle('playing', isCurrent && isPlaying);
        btn.innerText = (isCurrent && isPlaying) ? '❚❚' : '▶';
      });
    }

    function selectMahalayaTrack(index, e) {
      if (e) e.stopPropagation();
      if (activeList === 'mahalaya' && index === currentIndex) {

      } else {

      }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function updateTimeAndCountdown() {
      const now = new Date();
      let hours = now.getHours(), minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('liveClock').innerText = `${hours}:${minutes} ${ampm}`;

      const pujoDate = new Date('October 17, 2026 00:00:00').getTime();
      const diff = pujoDate - now.getTime();
      const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));

      const countdownText = daysLeft > 0 
        ? `দুর্গাপুজোর আর ${daysLeft} দিন বাকি` 
        : "শুভ শারদীয়া!";
      document.getElementById('pujoCountdown').innerText = countdownText;
    }
    setInterval(updateTimeAndCountdown, 1000); 
    updateTimeAndCountdown();

    function addRipple(e, dark) {
      const btn = e.currentTarget;
      const existing = btn.querySelector('.ripple');
      if (existing) existing.remove();
      const rect = btn.getBoundingClientRect();
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;
      const clientX = e.clientX || (rect.left + rect.width / 2);
      const clientY = e.clientY || (rect.top + rect.height / 2);
      const circle = document.createElement('span');
      circle.className = 'ripple' + (dark ? ' ripple-dark' : '');
      circle.style.width = circle.style.height = diameter + 'px';
      circle.style.left = (clientX - rect.left - radius) + 'px';
      circle.style.top = (clientY - rect.top - radius) + 'px';
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 600);
    }

    function rippleNav(e) {
      e.preventDefault();
      addRipple(e);
      const href = e.currentTarget.getAttribute('href');
      setTimeout(() => { window.open(href, '_blank'); }, 200);
    }

    function switchMode(mode, btn, e) {
      if (e) addRipple(e);
      document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');

      if(mode === 'player') {
        document.getElementById('playerView').classList.add('active');
      } else if (mode === 'parikrama') {
        document.getElementById('parikramaView').classList.add('active');
        getUserLocation();
      } else if (mode === 'metro') {
        document.getElementById('metroView').classList.add('active');
        renderMetroList();
      } else if (mode === 'mahalaya') {
        document.getElementById('mahalayaView').classList.add('active');
        highlightActiveMahalayaItem();
      }
    }

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * (Math.PI/180);
      const dLon = (lon2 - lon1) * (Math.PI/180); 
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; 
    }

    function getUserLocation() {
      const statusMsg = document.getElementById('statusMsg');

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let pandalsWithDistance = pandals.map(p => {
            p.distance = getDistanceFromLatLonInKm(userLat, userLng, p.lat, p.lng);
            return p;
          }).sort((a, b) => a.distance - b.distance);

          statusMsg.innerText = "Showing pandals nearest to you";
          renderPandals(pandalsWithDistance);
        }, () => {
          statusMsg.innerText = "Location access denied. Showing default list.";
          renderPandals(pandals);
        });
      } else {
        statusMsg.innerText = "Geolocation not supported. Showing default list.";
        renderPandals(pandals);
      }
    }

    function renderPandals(list) {
      document.getElementById('pandalContainer').innerHTML = list.map(p => {
        let distText = p.distance ? `<br><span style="color:#D4AF37; font-weight:600;">${p.distance.toFixed(1)} km away</span>` : "";
        return `
        <div class="pandal-card">
          <div><h4>${p.name}</h4><p>${p.location} ${distText}</p></div>
          <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" class="route-btn">Map</a>
        </div>`;
      }).join('');
    }

        </div>`;

    }
