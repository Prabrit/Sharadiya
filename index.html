<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharadiya</title>
  <link rel="icon" type="image/png" href="logo.png" class="site-logo">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Baloo+Da+2:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      --accent-gold: #D4AF37;
      --primary-crimson: #A91D22;

      --surface-container: rgba(32, 14, 16, 0.4);
      --surface-container-high: rgba(48, 18, 21, 0.5);
      --state-hover: rgba(255, 255, 255, 0.08);
      --state-press: rgba(255, 255, 255, 0.14);
      --elevation-2: 0 1px 3px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.28);
      --elevation-4: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      height: 100vh; width: 100vw; overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
    }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
    }

    .ui-container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px 40px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }

    .note-pill {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
      padding: 7px 16px 7px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
      color: #fff; text-decoration: none; cursor: pointer; overflow: hidden;
      transition: background .2s ease, transform .2s ease;
    }
    .note-pill:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
    .note-icon { color: var(--accent-gold); filter: drop-shadow(0 0 4px rgba(212,175,55,.6)); flex-shrink: 0; }

    .clock-container { display: flex; flex-direction: column; align-items: flex-end; }
    .clock { font-weight: 500; font-size: 0.9rem; letter-spacing: 1px; }

    .countdown-bar {
      font-family: 'Tiro Bangla', serif;
      font-size: 1.1rem;
      color: var(--accent-gold);
      margin-top: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    .center-title {
      position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
      text-align: center; width: 90%; max-width: 500px;
    }
    .bengali-title { font-family: 'Tiro Bangla', serif; font-size: 4.8rem; text-shadow: 2px 4px 12px rgba(0,0,0,0.4); margin-bottom: -10px;}
    .english-subtitle { font-size: 1.1rem; letter-spacing: 4px; opacity: 0.9; margin-bottom: 25px; }

    .view-switcher {
      display: flex; justify-content: center; gap: 6px; flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px);
      padding: 5px; border-radius: 30px; border: 1px solid var(--glass-border);
    }
    .switch-btn {
      position: relative; overflow: hidden;
      background: none; border: none; color: var(--text-muted);
      padding: 8px 16px; border-radius: 20px; font-weight: 600;
      font-size: 0.85rem; cursor: pointer; transition: all 0.3s;
    }
    .switch-btn.active { background: rgba(255, 255, 255, 0.15); color: #FFF; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .bottom-area {
      margin-top: auto; margin-bottom: 6vh; display: flex; flex-direction: column; gap: 15px;
      max-width: 650px; margin-left: auto; margin-right: auto; width: 100%;
    }

    .views-wrapper { width: 100%; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .glass-player {
      background: linear-gradient(160deg, var(--surface-container-high), var(--surface-container));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 28px;
      padding: 12px 14px 12px 12px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: var(--elevation-4);
    }
    .album-art {
      width: 60px; height: 60px; border-radius: 16px; flex-shrink: 0;
      background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=200&auto=format&fit=crop') center/cover;
      box-shadow: var(--elevation-2); transition: background-image 0.5s ease;
    }
    .player-controls { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .track-info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.85rem; }
    .track-title { font-weight: 600; font-size: .92rem; letter-spacing: .1px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-time { color: var(--text-muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; flex-shrink: 0; }

    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; position: relative; cursor: pointer;
    }
    .progress-fill {
      height: 100%; width: 0%; background: var(--accent-gold);
      border-radius: 2px; position: relative; transition: width 0.5s linear;
    }
    .progress-fill::after {
      content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent-gold);
      box-shadow: 0 0 6px rgba(212,175,55,.7);
    }

    .btn-row { display: flex; align-items: center; gap: 8px; }

    .ctrl-btn {
      position: relative; overflow: hidden;
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: white; cursor: pointer;
      opacity: 0.85; font-size: 1.1rem; transition: background .2s ease, opacity .2s ease;
    }
    .ctrl-btn:hover { background: var(--state-hover); opacity: 1; }

    .play-btn {
      position: relative; overflow: hidden;
      width: 50px; height: 50px; background: var(--accent-gold); color: #2A1400; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding-left: 3px;
      box-shadow: var(--elevation-2); transition: transform .15s ease, box-shadow .2s ease;
    }

    .menu-btn {
      position: relative; overflow: hidden;
      background: rgba(255,255,255,0.05); border: none;
      color: white; width: 44px; height: 62px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s; flex-shrink: 0; font-size: 1.2rem;
    }

    .ripple {
      position: absolute; border-radius: 50%; transform: scale(0);
      background: rgba(255,255,255,.5); animation: ripple-anim .55s ease-out; pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(2.8); opacity: 0; } }

    .pandal-list-panel {
      background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 18px; max-height: 280px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .pandal-list-panel::-webkit-scrollbar { width: 6px; }
    .pandal-list-panel::-webkit-scrollbar-track { background: transparent; }
    .pandal-list-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .pandal-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: rgba(0,0,0,0.2);
      border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05);
    }
    .pandal-card h4 { font-size: 0.95rem; }
    .pandal-card p { font-size: 0.8rem; color: var(--text-muted); }
    .route-btn { background: var(--primary-crimson); color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; flex-shrink: 0;}

    .footer {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 0.82rem; font-weight: 500; color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.5px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none; z-index: 5;
    }

    .drawer {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 600px; height: 42vh; max-height: 360px;
      background: rgba(18, 8, 10, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-bottom: none; z-index: 10;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 14px 18px; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
    }
    .drawer.open { bottom: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08);}
    .drawer-header h3 { font-size: 0.95rem; font-weight: 600; }
    .close-btn { background: none; border: none; color: #FFF; font-size: 1.3rem; cursor: pointer; opacity: 0.8; }
    .close-btn:hover { opacity: 1; }

    .playlist-items { 
      overflow-y: auto; 
      flex: 1;
      display: flex; flex-direction: column; gap: 6px; 
      padding-bottom: 10px;
      padding-right: 4px;
    }
    
    .playlist-items::-webkit-scrollbar { width: 4px; }
    .playlist-items::-webkit-scrollbar-track { background: transparent; }
    .playlist-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .playlist-item {
      position: relative; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      background: rgba(255,255,255,0.03); border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s;
    }
    .playlist-item:hover { background: rgba(255,255,255,0.1); border-color: var(--glass-border); }
    .playlist-item.active { background: rgba(212, 175, 55, 0.25); border-color: var(--accent-gold); }
    .playlist-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
    .playlist-info h5 { font-size: 0.82rem; font-weight: 600; line-height: 1.2; }
    .playlist-info p { font-size: 0.7rem; color: var(--text-muted); }

  </style>
</head>
<body>

  <!-- HIDDEN YOUTUBE PLAYER -->
  <div id="youtube-player" style="display: none;"></div>

  <!-- SILENT WAKE-LOCK AUDIO HACK -->
  <audio id="bgKeepAlive" loop style="display:none;">
    <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <div class="overlay"></div>

  <div class="ui-container">
    <nav class="top-bar">
      <a href="message.html" target="_blank" class="note-pill" onclick="rippleNav(event)" title="A little note from Prabrit">
        <svg class="note-icon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3H9z"/>
        </svg>
        <span>A Note</span>
      </a>
      <div class="clock-container">
        <div class="clock" id="liveClock">8:51 PM</div>
      </div>
    </nav>

    <div class="center-title">
      <h1 class="bengali-title">শারদীয়া</h1>
      <h2 class="english-subtitle">sharadiya</h2>
      <div class="view-switcher">
        <button class="switch-btn active" onclick="switchMode('player', this, event)">Sangeet Player</button>
        <button class="switch-btn" onclick="switchMode('parikrama', this, event)">Pujo Parikrama</button>
        <button class="switch-btn" onclick="switchMode('metro', this, event)">Metro Routes</button>
      </div>
      <div class="countdown-bar" id="pujoCountdown"></div>
    </div>

    <div class="bottom-area">
      <div class="views-wrapper">
        
        <!-- View 1: Custom Player UI -->
        <div id="playerView" class="view-panel active">
          <div class="glass-player">
            <div class="album-art" id="albumArt"></div>
            <div class="player-controls">
              <div class="track-info-row">
                <span class="track-title" id="trackTitle">Loading Pujo Vibe...</span>
                <span class="track-time" id="trackTime">0:00 / 0:00</span>
              </div>
              <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="btn-row">
                <button class="ctrl-btn" onclick="prevTrack(event)">⏮</button>
                <button class="ctrl-btn play-btn" id="mainPlayBtn" onclick="togglePlay(event)">▶</button>
                <button class="ctrl-btn" onclick="nextTrack(event)">⏭</button>
              </div>
            </div>
            <button class="menu-btn" onclick="toggleDrawer(event)">☰</button>
          </div>
        </div>

        <!-- View 2: Parikrama -->
        <div id="parikramaView" class="view-panel">
          <div class="pandal-list-panel">
            <div id="statusMsg" style="font-size:0.8rem; margin-bottom:10px; color:var(--text-muted);">Calculating nearest pandals...</div>
            <div id="pandalContainer"></div>
          </div>
        </div>

        <!-- View 3: Nearest Metro List -->
        <div id="metroView" class="view-panel">
            <div class="pandal-list-panel">
              <div style="font-size:0.8rem; margin-bottom:10px; color:var(--text-muted);">Nearest Metro Stations for Pandals</div>
              <div id="metroContainer"></div>
            </div>
        </div>

      </div>
    </div>

    <div class="footer">Made by prabrit with love ❤️</div>
  </div>

  <!-- Slide-out Curated Playlist Drawer -->
  <div class="drawer" id="playlistDrawer">
    <div class="drawer-header">
      <h3>🎶 Pujo Sangeet List</h3>
      <button class="close-btn" onclick="toggleDrawer()">×</button>
    </div>
    <div class="playlist-items" id="playlistContainer">
      <div style="font-size: 0.85rem; color: rgba(255,255,255,0.6); padding: 10px;">
        Hit Play to load the tracklist...
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const myPlaylistId = 'PLTIwWpbfjvr0';
    let player;
    let playlistIds = [];
    let isPlaying = false;
    let audioCtx = null;
    let silentOscillator = null;

    const bgImages = ['Sakti.png','chokhudan.jpg', 'alo.jpg', 'dristi.png', 'poribar.jpg' , 'prem.png' , 'pujoalo.jpg' , 'sobarpujo.jpg' ]; 
    let bgIndex = 0;

    function updateBackground() {
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const isLaptop = window.innerWidth > 768;

      if (isLandscape || isLaptop) {
        document.body.style.backgroundImage = `url('chokhudan.jpg')`;
      } else {
        document.body.style.backgroundImage = `url('${bgImages[bgIndex]}')`;
      }
    }

    function rotateBackground() {
      bgIndex = (bgIndex + 1) % bgImages.length;
      updateBackground();
    }
    
    setInterval(rotateBackground, 600000);
    window.addEventListener('resize', updateBackground);
    updateBackground();

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0', width: '0',
        playerVars: {
          'autoplay': 0, 'controls': 0, 'disablekb': 1, 'playsinline': 1, 
          'listType': 'playlist', 'list': myPlaylistId
        },
        events: {
          'onReady': (event) => {
             setupMediaSession();
             setTimeout(() => {
                playlistIds = player.getPlaylist() || [];
                if(playlistIds.length > 0) renderPlaylistDrawer();
             }, 1500);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // Start a completely silent web audio node to trick mobile CPUs into staying awake
    function startAudioWakeLock() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!silentOscillator) {
          silentOscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.00001; // virtually silent
          silentOscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          silentOscillator.start();
        }
      } catch(e) {}
    }

    function stopAudioWakeLock() {
      try {
        if (silentOscillator) {
          silentOscillator.stop();
          silentOscillator.disconnect();
          silentOscillator = null;
        }
      } catch(e) {}
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.setActionHandler('play', () => player && player.playVideo());
      navigator.mediaSession.setActionHandler('pause', () => player && player.pauseVideo());
      navigator.mediaSession.setActionHandler('stop', () => {
        if (player) player.pauseVideo();
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => prevTrack());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack());
      
      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (player && details.seekTime) player.seekTo(details.seekTime, true);
        });
      } catch(e) {}
    }

    function updateMediaSessionMetadata(videoData) {
      if (!('mediaSession' in navigator) || !videoData) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: videoData.title || 'Sharadiya Sangeet',
        artist: 'Pujo Playlist • Sharadiya',
        album: 'শারদীয়া',
        artwork: [
          { src: `https://img.youtube.com/vi/${videoData.video_id}/mqdefault.jpg`, sizes: '320x180', type: 'image/jpeg' },
        ]
      });
    }

    function onPlayerStateChange(event) {
      const playBtn = document.getElementById('mainPlayBtn');
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.innerText = '❚❚';
        playBtn.style.paddingLeft = '0';
        
        startAudioWakeLock();
        const keepAlive = document.getElementById('bgKeepAlive');
        if (keepAlive) keepAlive.play().catch(e => {});

        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';

        if (playlistIds.length === 0) {
          playlistIds = player.getPlaylist() || [];
          renderPlaylistDrawer();
        }

        const videoData = player.getVideoData();
        const currentIdx = player.getPlaylistIndex();

        if (videoData) {
          document.getElementById('trackTitle').innerText = videoData.title;
          document.getElementById('albumArt').style.backgroundImage = `url('https://img.youtube.com/vi/${videoData.video_id}/mqdefault.jpg')`;
          updateMediaSessionMetadata(videoData);

          const drawerItemTitle = document.getElementById(`title-${currentIdx}`);
          if (drawerItemTitle) drawerItemTitle.innerText = videoData.title;
        }
        highlightActiveTrackInDrawer(currentIdx);

      } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
        isPlaying = false;
        playBtn.innerText = '▶';
        playBtn.style.paddingLeft = '3px';
        
        stopAudioWakeLock();
        const keepAlive = document.getElementById('bgKeepAlive');
        if (keepAlive) keepAlive.pause();

        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      }
    }

    function togglePlay(e) {
      if (e) addRipple(e, true);
      if (!player) return;
      if (isPlaying) player.pauseVideo();
      else player.playVideo();
    }

    function nextTrack(e) { if (e) addRipple(e); if (player) player.nextVideo(); }
    function prevTrack(e) { if (e) addRipple(e); if (player) player.previousVideo(); }

    function renderPlaylistDrawer() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      playlistIds.forEach((id, index) => {
        container.innerHTML += `
          <div class="playlist-item" id="item-${index}" onclick="selectTrack(${index}, event)">
            <img class="playlist-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg">
            <div class="playlist-info">
              <h5 id="title-${index}">Pujo Track ${index + 1}</h5>
              <p>Click to Play</p>
            </div>
          </div>`;
      });
    }

    function highlightActiveTrackInDrawer(currentIdx) {
      document.querySelectorAll('.playlist-item').forEach((item, index) => {
        if (index === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function selectTrack(index, e) {
      if (e) addRipple(e);
      if (player) player.playVideoAt(index);
      setTimeout(toggleDrawer, 150);
    }

    setInterval(() => {
      if (player && isPlaying && typeof player.getCurrentTime === 'function') {
        const currentTime = player.getCurrentTime();
        const duration = player.getDuration();
        if (duration > 0) {
          const progressPercent = (currentTime / duration) * 100;
          document.getElementById('progressFill').style.width = progressPercent + '%';
          document.getElementById('trackTime').innerText = formatTime(currentTime) + ' / ' + formatTime(duration);
        }
      }
    }, 1000);

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return min + ":" + (sec < 10 ? "0" : "") + sec;
    }

    function updateTimeAndCountdown() {
      const now = new Date();
      let hours = now.getHours(), minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('liveClock').innerText = `${hours}:${minutes} ${ampm}`;

      const pujoDate = new Date('October 17, 2026 00:00:00').getTime();
      const diff = pujoDate - now.getTime();
      const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));

      const countdownText = daysLeft > 0 
        ? `দুর্গাপুজোর আর ${daysLeft} দিন বাকি` 
        : "শুভ শারদীয়া!";
      document.getElementById('pujoCountdown').innerText = countdownText;
    }
    setInterval(updateTimeAndCountdown, 1000); 
    updateTimeAndCountdown();

    function addRipple(e, dark) {
      const btn = e.currentTarget;
      const existing = btn.querySelector('.ripple');
      if (existing) existing.remove();
      const rect = btn.getBoundingClientRect();
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;
      const clientX = e.clientX || (rect.left + rect.width / 2);
      const clientY = e.clientY || (rect.top + rect.height / 2);
      const circle = document.createElement('span');
      circle.className = 'ripple' + (dark ? ' ripple-dark' : '');
      circle.style.width = circle.style.height = diameter + 'px';
      circle.style.left = (clientX - rect.left - radius) + 'px';
      circle.style.top = (clientY - rect.top - radius) + 'px';
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 600);
    }

    function rippleNav(e) {
      e.preventDefault();
      addRipple(e);
      const href = e.currentTarget.getAttribute('href');
      setTimeout(() => { window.open(href, '_blank'); }, 200);
    }

    function switchMode(mode, btn, e) {
      if (e) addRipple(e);
      document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');

      if(mode === 'player') {
        document.getElementById('playerView').classList.add('active');
      } else if (mode === 'parikrama') {
        document.getElementById('parikramaView').classList.add('active');
        getUserLocation();
      } else if (mode === 'metro') {
        document.getElementById('metroView').classList.add('active');
        renderMetroList();
      }
    }

      if (e) addRipple(e);
      document.getElementById('playlistDrawer').classList.toggle('open');

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * (Math.PI/180);
      const dLon = (lon2 - lon1) * (Math.PI/180); 
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; 
    }

    function getUserLocation() {
      const statusMsg = document.getElementById('statusMsg');

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          let pandalsWithDistance = pandals.map(p => {
            p.distance = getDistanceFromLatLonInKm(userLat, userLng, p.lat, p.lng);
            return p;
          }).sort((a, b) => a.distance - b.distance);

          statusMsg.innerText = "Showing pandals nearest to you";
          renderPandals(pandalsWithDistance);
        }, () => {
          statusMsg.innerText = "Location access denied. Showing default list.";
          renderPandals(pandals);
        });
      } else {
        statusMsg.innerText = "Geolocation not supported. Showing default list.";
        renderPandals(pandals);
      }
    }

    function renderPandals(list) {
      document.getElementById('pandalContainer').innerHTML = list.map(p => {
        let distText = p.distance ? `<br><span style="color:#D4AF37; font-weight:600;">${p.distance.toFixed(1)} km away</span>` : "";
        return `
        <div class="pandal-card">
          <div><h4>${p.name}</h4><p>${p.location} ${distText}</p></div>
          <a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" class="route-btn">Map</a>
        </div>`;
      }).join('');
    }

    function renderMetroList() {
      document.getElementById('metroContainer').innerHTML = pandals.map(p => {

          <a href="https://maps.google.com/?q=${metroQuery}" target="_blank" class="route-btn">Map</a>
        </div>`;
      }).join('');
    }

  <script>
    // Force play recovery if browser visibility changes
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && isPlaying && player) {
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    });

    // Backup background loop interval to kickstart playback if throttled
    setInterval(() => {
      if (isPlaying && player && typeof player.getPlayerState === 'function') {
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    }, 2000);
  </script>

      if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) e.preventDefault();
